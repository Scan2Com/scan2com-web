<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Scan2Com · Generador de pegatinas</title>
<link rel="icon" href="/app/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
:root{--ink:#1d1f22;--mut:#6b7078;--line:#e1e4e8;--bg:#f3f4f6;--red:#e8352b;--teal:#1aa3d9}
*{box-sizing:border-box;min-width:0}
body{margin:0;font:15px/1.5 Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg)}
header{background:#1e1e1e;color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px}
header img{width:34px;height:34px}header b{font-size:18px;flex:1}header span{font-size:13px;color:#bbb}
main{max-width:1100px;margin:0 auto;padding:18px;display:grid;grid-template-columns:330px minmax(0,1fr);gap:18px}
@media(max-width:820px){main{grid-template-columns:minmax(0,1fr)}}
.box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}
h2{font-size:14px;margin:0 0 10px;color:var(--mut)}
label{display:block;font-size:13px;color:var(--mut);margin-top:10px}
input,select{width:100%;font:inherit;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:10px;margin-top:4px;background:#fff}
.chk{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px;color:var(--ink)}.chk input{width:20px;height:20px;margin:0}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:11px 14px;cursor:pointer;background:#2a2d31;color:#fff;min-height:44px}
button.red{background:var(--red)}button.light{background:#e6e8eb;color:var(--ink)}button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.row button{flex:1}
.msg{font-size:14px;margin-top:10px}.err{color:#b3261e}.ok{color:#1a7a1a}
.bar{height:8px;background:#eee;border-radius:4px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:var(--teal);width:0;transition:width .2s}
#cards{display:grid;gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}
.card canvas{width:100%;height:auto;display:block;border-radius:6px;background:#ddd}
.card .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--mut);margin-top:8px}
.card .meta button{min-height:36px;padding:6px 12px;font-size:13px}
.empty{color:var(--mut);text-align:center;padding:40px 10px}
#lotes div{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer}
#lotes div:hover{color:var(--teal)}
.hint{font-size:12px;color:var(--mut);margin-top:6px}
</style>
</head>
<body>
<header><img src="/app/logo.png" alt=""><b>Generador de pegatinas</b><span id="who"></span></header>
<main>
  <div>
    <div class="box" id="login">
      <h2>Entrar como administrador</h2>
      <label>Email</label><input id="em" type="email" autocomplete="email">
      <label>Contraseña</label><input id="pw" type="password" autocomplete="current-password">
      <div class="row"><button id="go">Entrar</button></div>
      <div class="msg err" id="lerr"></div>
    </div>
    <div class="box" id="noadm" hidden><h2>Sin permiso</h2><p class="msg err">Esta cuenta no es administradora de Scan2Com.</p><div class="row"><button class="light" id="out2">Cerrar sesión</button></div></div>
    <div id="tool" hidden>
    <div class="box">
      <h2>Nuevo lote</h2>
      <label>Troquel</label><select id="tro"></select>
      <label>Nº de tarjetas (packs)</label><input id="num" type="number" min="1" max="2000" value="1">
      <label>Nombre del lote</label><input id="lote" placeholder="Ej. IMPRENTA-01">
      <label>Estilo del QR</label><select id="est"><option value="round">Redondeado (con el ojo)</option><option value="classic">Clásico</option></select>
      <label class="chk"><input type="checkbox" id="prueba" checked> Muestra (no crea códigos reales)</label>
      <div class="row"><button class="red" id="gen">Generar</button></div>
      <div class="bar"><i id="prog"></i></div>
      <div class="msg" id="gmsg"></div>
    </div>
    <div class="box" style="margin-top:14px" id="lotesBox" hidden>
      <h2>Lotes creados · pulsa para reimprimir</h2>
      <div id="lotes"></div>
    </div>
    <div class="row"><button class="light" id="out">Cerrar sesión</button></div>
    </div>
  </div>
  <div id="tool2" hidden>
    <div class="box">
      <div class="row" style="margin-top:0">
        <select id="pdffmt" style="flex:1;margin:0"><option value="card">PDF tamaño tarjeta (210×100 mm)</option><option value="a4">PDF A4 (todas las que quepan por hoja)</option></select>
        <button id="pdf" disabled>Descargar PDF</button><button class="light" id="csv" disabled>CSV</button>
      </div>
      <div class="hint">Las bases llevan sangre de 1,7–2 mm para el troquel de imprenta. Imprimir al 100 %, 300 ppp.</div>
    </div>
    <div id="cards" style="margin-top:14px"><div class="empty">Elige un troquel y pulsa Generar.</div></div>
  </div>
</main>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SITE = 'https://scan2com.com';
const sb = createClient('https://kbkyosyenotqjcgujbmn.supabase.co', 'sb_publishable_Ac2fFMZTIWXMGfEURbVc8Q_Z2gcpujt');
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- troqueles: mismas bases y coordenadas que el generador de Luis (px a 300 ppp) ---------- */
const P = (x, y, size, mirror) => ({ x, y, size, mirror: !!mirror });
const H20 = [['alert', 92, 92, 278], ['alert', 854, 59, 115], ['alert', 1058, 64, 130], ['alert', 507, 283, 166], ['alert', 793, 283, 166],
  ['chat', 92, 670, 278], ['chat', 507, 648, 166], ['chat', 793, 648, 166], ['chat', 854, 1007, 115], ['chat', 1058, 365, 130],
  ['link', 1292, 64, 130], ['link', 1870, 59, 115], ['link', 2110, 92, 278], ['link', 1522, 283, 166], ['link', 1808, 283, 166],
  ['contact', 1522, 648, 166], ['contact', 1808, 648, 166], ['contact', 2110, 670, 278], ['contact', 1292, 365, 130], ['contact', 1870, 1007, 115]];
const COCHE = { kind: 'single', stickers: [{ type: 'alert', positions: [P(147, 148, 335, 1), P(89, 882, 180, 1), P(1997, 148, 335, 1), P(1640, 882, 180, 1)] }], validation: P(1347, 294, 442) };
const coche = (color, file) => ({ ...COCHE, nombre: `Pack coche ${color} (vinilo transparente)`, base: `bases/${file}.png`, style: { design: 'car', car_color: color } });
const TRO = {
  hoja20: { nombre: 'Hoja 20 códigos (opaca)', base: 'bases/hoja20-opaca.png', kind: 'sheet', stickers: H20.map(([type, x, y, s]) => ({ type, positions: [P(x, y, s)] })), validation: P(1071, 754, 336) },
  'coche-rojo': coche('rojo', 'coche-rojo'), 'coche-gris-claro': coche('gris claro', 'coche-gris-claro'), 'coche-gris-oscuro': coche('gris oscuro', 'coche-gris-oscuro'),
  'coche-azul': coche('azul', 'coche-azul'), 'coche-verde': coche('verde', 'coche-verde'),
  flyer: { nombre: 'Tarjeta de muestra / flyer (1 código)', base: 'bases/flyer.png', kind: 'single', stickers: [{ type: 'link', positions: [P(1493, 164, 204)] }], validation: P(863, 69, 397) }
};
$('#tro').innerHTML = Object.entries(TRO).map(([k, t]) => `<option value="${k}">${esc(t.nombre)}</option>`).join('');

/* ---------- imágenes ---------- */
const imgs = {};
const img = src => imgs[src] ||= new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ko(new Error('No se encuentra ' + src)); i.src = src; });

/* ---------- QR ---------- */
function qrCanvas(text, size, style, ec, eye) {
  const q = qrcode(0, ec); q.addData(text); q.make(); const n = q.getModuleCount();
  const u = Math.max(8, Math.ceil(size * 4 / n)), c = document.createElement('canvas'); c.width = c.height = n * u;
  const g = c.getContext('2d'); g.fillStyle = '#000';
  const dark = (r, k) => r >= 0 && k >= 0 && r < n && k < n && q.isDark(r, k);
  const finder = (r, k) => (r < 7 && k < 7) || (r < 7 && k >= n - 7) || (r >= n - 7 && k < 7);
  if (style === 'classic') { for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (dark(r, k)) g.fillRect(k * u, r * u, u, u); return c; }
  for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) {
    if (!dark(r, k) || finder(r, k)) continue;
    g.beginPath(); g.arc((k + .5) * u, (r + .5) * u, u / 2, 0, 7); g.fill();
    if (dark(r, k + 1) && !finder(r, k + 1)) g.fillRect((k + .5) * u, r * u, u, u);
    if (dark(r + 1, k) && !finder(r + 1, k)) g.fillRect(k * u, (r + .5) * u, u, u);
  }
  for (const [r, k] of [[0, 0], [0, n - 7], [n - 7, 0]]) g.drawImage(eye, k * u, r * u, 7 * u, 7 * u);
  return c;
}

/* ---------- tarjeta ---------- */
async function renderCard(tk, pack, codes, style, muestra) {
  const t = TRO[tk], base = await img(t.base), eye = await img('bases/ojo.png');
  const c = document.createElement('canvas'); c.width = base.width; c.height = base.height;
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(base, 0, 0);
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
  t.stickers.forEach((st, i) => st.positions.forEach(p => {
    const q = qrCanvas(`${SITE}/s/${codes[i].id}`, p.size, style, 'M', eye);
    g.save(); if (p.mirror) { g.translate(p.x * 2 + p.size, 0); g.scale(-1, 1); }
    g.drawImage(q, p.x, p.y, p.size, p.size); g.restore();
  }));
  const v = t.validation;
  g.drawImage(qrCanvas(`${SITE}/p/${pack}`, v.size, 'classic', 'H', eye), v.x, v.y, v.size, v.size);
  g.fillStyle = '#3c3c3c'; g.font = `700 ${Math.max(18, v.size / 14 | 0)}px Inter, Arial`; g.textAlign = 'center'; g.textBaseline = 'top';
  g.fillText(pack, v.x + v.size / 2, v.y + v.size + 30);
  if (muestra) { g.save(); g.translate(c.width / 2, c.height / 2); g.rotate(-0.21); g.fillStyle = 'rgba(230,0,0,.43)'; g.font = `700 ${c.height / 9 | 0}px Inter, Arial`; g.textBaseline = 'middle'; g.fillText('MUESTRA · NO VÁLIDO', 0, 0); g.restore(); }
  return c;
}

/* ---------- estado ---------- */
const S = { admin: false, items: [], lote: '' };
const ALPHA = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', rid = n => Array.from(crypto.getRandomValues(new Uint32Array(n)), x => ALPHA[x % 32]).join('');
const today = () => new Date().toISOString().slice(0, 10).replace(/-/g, '');

async function rpc(fn, args) {
  const { data, error } = await sb.rpc(fn, args);
  if (error) throw new Error(error.message);
  if (data?.ok === false) throw new Error({ forbidden: 'Tu cuenta no es administradora (falta en la tabla admins, SQL 014).', bad_args: 'Datos del troquel no válidos.' }[data.error] || data.error);
  return data;
}

async function showCards() {
  const box = $('#cards'); box.innerHTML = ''; $('#pdf').disabled = $('#csv').disabled = !S.items.length;
  if (!S.items.length) { box.innerHTML = '<div class="empty">Elige un troquel y pulsa Generar.</div>'; return; }
  const shown = S.items.slice(0, 30);
  for (const [n, it] of shown.entries()) {
    const d = document.createElement('div'); d.className = 'card';
    d.innerHTML = `<div class="meta" style="margin:0 0 8px"><span>${n + 1}. Pack <b>${esc(it.pack)}</b> · ${it.codes.length} código${it.codes.length > 1 ? 's' : ''}${it.claimed ? ' · ya vinculado' : ''}</span><button class="light">PNG</button></div>`;
    const cv = await renderCard(it.tk, it.pack, it.codes, $('#est').value, it.muestra); d.prepend(cv); box.append(d);
    d.querySelector('button').onclick = () => cv.toBlob(b => save(b, `${String(n + 1).padStart(4, '0')}_${it.pack}.png`));
  }
  if (S.items.length > shown.length) box.insertAdjacentHTML('beforeend', `<div class="empty">… y ${S.items.length - shown.length} tarjetas más (van todas en el PDF y el CSV).</div>`);
}
function save(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
const setMsg = (t, cls = '') => { $('#gmsg').className = 'msg ' + cls; $('#gmsg').textContent = t; };
const setProg = f => { $('#prog').style.width = (f * 100) + '%'; };

/* ---------- generar ---------- */
$('#gen').onclick = async () => {
  const tk = $('#tro').value, t = TRO[tk], N = Math.max(1, Math.min(2000, +$('#num').value || 1)), muestra = $('#prueba').checked;
  if (!S.admin) return;
  const lote = ($('#lote').value.trim() || `${muestra ? 'PRUEBA-' : ''}${tk.toUpperCase()}-${today()}`).toUpperCase();
  if (!muestra && N > 20 && !confirmBox(`Se van a crear ${N} packs reales en el lote ${lote}.`)) return;
  const types = t.stickers.map(s => s.type); $('#gen').disabled = true; S.items = []; S.lote = lote;
  try {
    for (let i = 0; i < N; i++) {
      const r = muestra ? { pack: rid(10), codes: types.map(type => ({ id: rid(8), type })) }
        : await rpc('admin_print_pack', { p_kind: t.kind, p_types: types, p_batch: lote, p_layout: tk, p_style: t.style || {} });
      S.items.push({ tk, pack: r.pack, codes: r.codes, muestra }); setProg((i + 1) / N); setMsg(`${i + 1}/${N} packs ${muestra ? 'de muestra' : 'creados'}…`);
    }
    setMsg(`Lote ${lote}: ${N} tarjeta${N > 1 ? 's' : ''} lista${N > 1 ? 's' : ''}.`, 'ok'); await showCards(); if (!muestra) loadBatches();
  } catch (e) { setMsg(e.message + (S.items.length ? ` (se crearon ${S.items.length} packs; puedes reimprimirlos desde Lotes)` : ''), 'err'); await showCards(); }
  $('#gen').disabled = false;
};
function confirmBox(t) { return window.confirm ? confirm(t + ' ¿Continuar?') : true; }

/* ---------- reimprimir ---------- */
async function reprint(batch) {
  try {
    setMsg('Cargando lote ' + batch + '…'); const r = await rpc('admin_batch', { p_batch: batch });
    S.items = r.packs.filter(p => TRO[p.layout]).map(p => ({ tk: p.layout, pack: p.pack, codes: p.codes, claimed: p.claimed, muestra: false })); S.lote = batch;
    const nc = r.packs.filter(p => p.claimed).length; setMsg(`Lote ${batch}: ${S.items.length} tarjetas${nc ? ` · ${nc} ya vinculadas a un usuario` : ''}.`, nc ? 'err' : 'ok'); await showCards();
  } catch (e) { setMsg(e.message, 'err'); }
}
async function loadBatches() {
  try { const r = await rpc('admin_batches', {}); $('#lotesBox').hidden = false;
    $('#lotes').innerHTML = r.batches.map(b => `<div data-b="${esc(b.batch)}"><b>${esc(b.batch)}</b><span>${b.packs} packs · ${b.claimed} vinculados · ${esc(b.at.slice(0, 10))}</span></div>`).join('') || '<div>Aún no hay lotes.</div>';
    document.querySelectorAll('#lotes [data-b]').forEach(d => d.onclick = () => reprint(d.dataset.b));
  } catch (e) {}
}

/* ---------- exportar ---------- */
$('#pdf').onclick = async () => {
  const a4 = $('#pdffmt').value === 'a4', { jsPDF } = window.jspdf; $('#pdf').disabled = true;
  const doc = a4 ? new jsPDF({ unit: 'mm', format: 'a4' }) : new jsPDF({ unit: 'mm', format: [210, 100], orientation: 'landscape' });
  for (const [i, it] of S.items.entries()) {
    const cv = await renderCard(it.tk, it.pack, it.codes, $('#est').value, it.muestra), w = cv.width / 300 * 25.4, h = cv.height / 300 * 25.4;
    if (a4) {  // tantas como quepan en el A4 (2 hojas de 210×100, 6 tarjetas de muestra…), repartidas con el mismo hueco
      const g = 3, cols = Math.max(1, Math.floor((210 - g) / (w + g))), rows = Math.max(1, Math.floor((297 - g) / (h + g))), per = cols * rows, k = i % per;
      if (i && k === 0) doc.addPage();
      const gx = (210 - cols * w) / (cols + 1), gy = (297 - rows * h) / (rows + 1);
      doc.addImage(cv, 'PNG', gx + (k % cols) * (w + gx), gy + Math.floor(k / cols) * (h + gy), w, h, undefined, 'FAST');
    }
    else { if (i) doc.addPage([w, h], w > h ? 'landscape' : 'portrait'); doc.addImage(cv, 'PNG', 0, 0, w, h, undefined, 'FAST'); }
    setProg((i + 1) / S.items.length); setMsg(`PDF: ${i + 1}/${S.items.length}…`);
  }
  save(doc.output('blob'), S.lote + '.pdf'); setMsg('PDF descargado.', 'ok'); $('#pdf').disabled = false;
};
$('#csv').onclick = () => {
  const rows = [['lote', 'troquel', 'pack', 'url_maestro', 'posicion', 'codigo', 'tipo', 'url']];
  S.items.forEach(it => it.codes.forEach((c, i) => rows.push([S.lote, it.tk, it.pack, `${SITE}/p/${it.pack}`, i + 1, c.id, c.type, `${SITE}/s/${c.id}`])));
  save(new Blob(['﻿' + rows.map(r => r.join(';')).join('\n')], { type: 'text/csv' }), S.lote + '.csv');
};
$('#est').onchange = () => S.items.length && showCards();

/* ---------- sesión ---------- */
// todo el generador queda oculto hasta entrar con una cuenta de la tabla admins
async function start(session) {
  S.admin = false; S.items = []; $('#tool').hidden = $('#tool2').hidden = $('#noadm').hidden = true;
  $('#login').hidden = !!session; $('#who').textContent = session ? session.user.email : '';
  if (!session) return;
  const { data } = await sb.from('admins').select('user_id').eq('user_id', session.user.id).maybeSingle();
  S.admin = !!data; $('#tool').hidden = $('#tool2').hidden = !S.admin; $('#noadm').hidden = S.admin;
  if (S.admin) { showCards(); loadBatches(); }
}
$('#out').onclick = $('#out2').onclick = () => sb.auth.signOut();
$('#go').onclick = async () => {
  $('#lerr').textContent = ''; const { error } = await sb.auth.signInWithPassword({ email: $('#em').value.trim(), password: $('#pw').value });
  if (error) $('#lerr').textContent = /Invalid login/i.test(error.message) ? 'Email o contraseña incorrectos.' : error.message;
};
sb.auth.onAuthStateChange((ev, s) => { if (ev === 'SIGNED_IN' || ev === 'SIGNED_OUT') start(s); });
start((await sb.auth.getSession()).data.session);
</script>
</body>
</html>
