<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Scan & — Mis códigos</title>
<link rel="manifest" href="/app/manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cg fill='none' stroke-width='11' stroke-linecap='round'%3E%3Cpath d='M8 44V22Q8 8 22 8h22' stroke='%232f8fe0'/%3E%3Cpath d='M56 8h22q14 0 14 14v22' stroke='%232fc23a'/%3E%3Cpath d='M8 56v22q0 14 14 14h22' stroke='%23e8352b'/%3E%3Cpath d='M92 56v22q0 14-14 14H56' stroke='%23e6c62a'/%3E%3C/g%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Comfortaa:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
:root{--teal:#1aa3d9;--ink:#1d1f22;--mut:#7a7f87;--line:#e6e8eb;--bg:#eef0f2;--red:#e8352b;--green:#2fc23a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fff}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);max-width:560px;margin:0 auto;display:flex;flex-direction:column;min-height:100%}
#app{display:flex;flex-direction:column;flex:1;min-height:100vh}
.bar{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:3}
.bar .name{font-family:Comfortaa;font-weight:700;font-size:19px;flex:1}
.ib{background:none;border:0;font-size:20px;cursor:pointer;padding:6px;color:#555}
.tabs{display:flex;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:57px;z-index:2}
.tabs button{flex:1;padding:12px 0;border:0;background:none;font:inherit;font-size:13px;font-weight:600;color:var(--mut);border-bottom:3px solid transparent;letter-spacing:.04em;cursor:pointer}
.tabs button.on{color:var(--ink);border-color:var(--teal)}
.badge{background:var(--red);color:#fff;border-radius:9px;font-size:10px;padding:1px 6px;margin-left:4px}
.body{flex:1;overflow:auto;padding-bottom:90px}
.pad{padding:16px}
.item{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.item .t{font-weight:600}.item .s{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.off .t,.item.off .s{color:#b5b9bf}
.grow{flex:1;min-width:0}
.pw{width:40px;height:40px;border-radius:50%;border:2px solid #444;display:grid;place-items:center;font-size:17px;cursor:pointer;background:#f2f2f2;flex:none}
.pw.on{background:radial-gradient(circle at 40% 35%,#7dff7d,#1db31d);border-color:#1a7a1a;color:#063}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:18px;flex:none;background:#d9dde2}
.star{font-size:22px;color:#c5c9ce;background:none;border:0;cursor:pointer;padding:4px}
.star.on{color:#f5b301}
.btn{border:0;border-radius:12px;padding:13px 14px;font:inherit;font-weight:600;cursor:pointer;background:#2a2d31;color:#fff;width:100%;font-size:15px}
.btn.light{background:#e4e6e9;color:var(--ink)}
.btn.teal{background:var(--teal)}
.btn.red{background:var(--red)}
.btn.sm{width:auto;padding:9px 12px;font-size:13px}
.btn:disabled{opacity:.5}
input,textarea,select{width:100%;font:inherit;font-size:16px;padding:11px;border:1px solid var(--line);border-radius:10px;margin:4px 0 12px;background:#fff}
label{font-size:13px;color:var(--mut)}
.chk{display:flex;gap:10px;align-items:center;font-size:15px;margin:8px 0}
.chk input{width:20px;height:20px;margin:0}
.sub{margin-left:30px;font-size:14px}
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(22px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:#2a2d31;color:#fff;border:0;font-size:28px;cursor:pointer;box-shadow:0 6px 14px rgba(0,0,0,.25);z-index:4}
.toast{position:fixed;left:50%;transform:translate(-50%,-150%);top:10px;width:min(92%,520px);background:#111;color:#fff;border-radius:14px;padding:12px 14px;font-size:14px;transition:.3s;z-index:20;cursor:pointer}
.toast.show{transform:translate(-50%,0)}
.alarm{position:fixed;inset:0;background:linear-gradient(#e8352b,#a9160f);color:#fff;z-index:15;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;gap:12px}
.alarm .big{font-size:70px;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.15)}}
.welcome{display:flex;flex-direction:column;align-items:center;padding:40px 22px calc(30px + env(safe-area-inset-bottom));gap:18px;flex:1;background:var(--bg)}
.feat{display:flex;justify-content:space-around;width:100%;color:#8d9298;font-size:13px;text-align:center}
.feat div{font-size:26px}
.row2{display:flex;gap:10px;width:100%}
.empty{text-align:center;color:var(--mut);padding:40px 16px;font-size:14px;line-height:1.5}
.err{color:#b3261e;font-size:14px;margin:6px 0}
.ok{color:#1a7a1a;font-size:14px;margin:6px 0}
.qrbox{display:flex;flex-direction:column;align-items:center;padding:20px 16px 10px;gap:8px}
.qrbox canvas{width:220px;height:220px;image-rendering:pixelated;border-radius:14px;border:10px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.link{font-size:13px;color:var(--mut);word-break:break-all;text-align:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.msgs{display:flex;flex-direction:column;gap:6px;padding:14px}
.m{max-width:80%;padding:9px 12px;border-radius:16px;font-size:15px;line-height:1.4;word-wrap:break-word}
.m.me{align-self:flex-end;background:var(--teal);color:#fff;border-bottom-right-radius:4px}
.m.them{align-self:flex-start;background:#eceef0;border-bottom-left-radius:4px}
.m .who{font-size:11px;opacity:.8;margin-bottom:2px}
.notice{background:#fff4d6;font-size:13px;padding:9px 14px}
.compose{display:flex;gap:6px;padding:10px 10px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#fff;position:sticky;bottom:0}
.compose input{margin:0}
.back{background:none;border:0;font:inherit;color:var(--teal);cursor:pointer;padding:4px 6px;font-weight:600;font-size:22px}
.ev{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;gap:12px}
.ev.new{background:#fff6f5}
.camwrap{position:relative;background:#000;border-radius:14px;overflow:hidden}
.camwrap video{width:100%;display:block}
.section{font-size:12px;font-weight:700;color:var(--mut);letter-spacing:.06em;margin:18px 0 4px}
.pill{font-size:12px;background:#eef0f2;border-radius:8px;padding:3px 8px;display:inline-flex;gap:6px;align-items:center;margin:2px 4px 2px 0}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div id="app"></div>
<div id="overlay"></div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SITE = 'https://scan.originalbim.com';
const sb = createClient('https://kbkyosyenotqjcgujbmn.supabase.co', 'sb_publishable_Ac2fFMZTIWXMGfEURbVc8Q_Z2gcpujt');

const LOGO = (s = 40) => `<svg width="${s}" height="${s}" viewBox="0 0 100 100"><g fill="none" stroke-width="11" stroke-linecap="round"><path d="M8 44V22Q8 8 22 8h22" stroke="#2f8fe0"/><path d="M56 8h22q14 0 14 14v22" stroke="#2fc23a"/><path d="M8 56v22q0 14 14 14h22" stroke="#e8352b"/><path d="M92 56v22q0 14-14 14H56" stroke="#e6c62a"/></g><text x="50" y="68" text-anchor="middle" font-family="Comfortaa" font-weight="700" font-size="52" fill="#333">S</text></svg>`;
const TYPES = { alert: ['🚗', 'Alert'], chat: ['💬', 'Chat'], contact: ['📇', 'Contact'], link: ['🏷️', 'Link'] };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const $ = s => document.querySelector(s);
const ago = d => { const s = (Date.now() - new Date(d)) / 1000; if (s < 60) return 'ahora'; if (s < 3600) return Math.floor(s / 60) + ' min'; if (s < 86400) return Math.floor(s / 3600) + ' h'; return new Date(d).toLocaleDateString('es-ES'); };
const ls = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };

const S = { user: null, screen: 'welcome', tab: 'codes', view: null, codes: [], chats: [], favs: new Set(), events: [], msgs: {}, members: {}, err: '', info: '', busy: false, alarm: null, unread: ls.get('sa_unread', {}), seenEv: ls.get('sa_seen_ev', 0) };
const app = $('#app');

function toast(t, go) { const el = $('#toast'); el.textContent = t; el.classList.add('show'); el.onclick = () => { el.classList.remove('show'); go && go(); }; clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 4000); }
function beep() { try { const a = new (window.AudioContext || window.webkitAudioContext)(); [0, .35, .7].forEach(t => { const o = a.createOscillator(), g = a.createGain(); o.frequency.value = 880; o.connect(g); g.connect(a.destination); g.gain.setValueAtTime(.3, a.currentTime + t); g.gain.exponentialRampToValueAtTime(.001, a.currentTime + t + .3); o.start(a.currentTime + t); o.stop(a.currentTime + t + .3); }); navigator.vibrate && navigator.vibrate([300, 150, 300, 150, 300]); } catch (e) {} }
function notify(title, body) { try { if ('Notification' in window && Notification.permission === 'granted' && document.hidden) new Notification(title, { body, icon: '/app/icon-192.png' }); } catch (e) {} }

/* ---------------- datos ---------------- */
async function loadAll() {
  const [c, ch, f, ev] = await Promise.all([
    sb.from('codes').select('*').order('created_at'),
    sb.from('chats').select('id,code_id,name,created_at').order('created_at', { ascending: false }),
    sb.from('chat_favorites').select('chat_id'),
    sb.from('events').select('*').order('created_at', { ascending: false }).limit(100)
  ]);
  S.codes = c.data || []; S.chats = ch.data || []; S.favs = new Set((f.data || []).map(x => x.chat_id)); S.events = ev.data || [];
  if (S.chats.length) {
    const { data } = await sb.from('messages').select('*').in('chat_id', S.chats.map(x => x.id)).order('id');
    S.msgs = {}; (data || []).forEach(m => (S.msgs[m.chat_id] ||= []).push(m));
  }
}
const codeOf = id => S.codes.find(c => c.id === id);
const lastMsg = cid => (S.msgs[cid] || []).at(-1);
const chatOff = ch => { const c = codeOf(ch.code_id); return c && !c.is_on && !S.favs.has(ch.id); };
const newEvents = () => S.events.filter(e => e.id > S.seenEv).length;
const unreadTotal = () => Object.values(S.unread).reduce((a, b) => a + b, 0);

let channel = null;
function subscribe() {
  channel?.unsubscribe();
  channel = sb.channel('owner')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, async ({ new: m }) => {
      if (!S.chats.find(c => c.id === m.chat_id)) { const { data } = await sb.from('chats').select('id,code_id,name,created_at').eq('id', m.chat_id).single(); if (data) S.chats.unshift(data); }
      const list = (S.msgs[m.chat_id] ||= []); if (!list.find(x => x.id === m.id)) list.push(m);
      if (m.from_visitor) {
        const viewing = S.view?.t === 'chat' && S.view.id === m.chat_id && !document.hidden;
        if (!viewing) { S.unread[m.chat_id] = (S.unread[m.chat_id] || 0) + 1; ls.set('sa_unread', S.unread); }
        const ch = S.chats.find(c => c.id === m.chat_id), code = codeOf(ch?.code_id);
        if (!viewing) { toast(`💬 ${ch?.name || 'Chat'} · ${code?.name || ''}: ${m.body}`, () => { S.view = { t: 'chat', id: m.chat_id }; render(); }); notify('Nuevo mensaje · ' + (code?.name || 'Scan &'), m.body); beep(); }
      }
      render(true);
    })
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'events' }, ({ new: e }) => {
      S.events.unshift(e); const code = codeOf(e.code_id);
      if (e.kind === 'alert' || e.kind === 'call') { S.alarm = e; beep(); notify('🔔 Alerta · ' + (code?.name || 'Scan &'), e.body || 'Alguien ha escaneado tu código y te avisa'); }
      else { toast(`✉️ Mensaje en “${code?.name || ''}”: ${e.body || ''}`, () => { S.tab = 'alerts'; S.view = null; render(); }); notify('✉️ Mensaje · ' + (code?.name || ''), e.body || ''); }
      render(true);
    })
    .subscribe();
}

/* ---------------- render ---------------- */
function render(soft) {
  const keep = soft && document.activeElement?.id ? { id: document.activeElement.id, v: document.activeElement.value } : null;
  if (S.recovery) renderNewPass();
  else if (!S.user) renderAuth();
  else if (S.view?.t === 'edit') renderEdit();
  else if (S.view?.t === 'qr') renderQR();
  else if (S.view?.t === 'chat') renderChat();
  else if (S.view?.t === 'pack') renderPack();
  else renderHome();
  $('#overlay').innerHTML = S.alarm ? alarmHTML() : '';
  if (keep) { const el = document.getElementById(keep.id); if (el) { el.value = keep.v; el.focus(); } }
}

function renderAuth() {
  if (S.screen === 'welcome') {
    app.innerHTML = `<div class="welcome"><div style="margin-top:20px">${LOGO(190)}</div>
      <div class="feat"><span><div>📳</div>Alert</span><span><div>💬</div>Chat</span><span><div>ℹ️</div>Info</span><span><div>✉️</div>E-mail</span></div>
      <p style="text-align:center;color:#666;margin:0">Conecta tus objetos con quien los encuentre, sin dar tu teléfono.</p>
      <div class="row2" style="margin-top:auto"><button class="btn light" id="gL">Entrar</button><button class="btn" id="gR">Crear cuenta</button></div></div>`;
    $('#gL').onclick = () => { S.screen = 'login'; S.err = S.info = ''; render(); };
    $('#gR').onclick = () => { S.screen = 'register'; S.err = S.info = ''; render(); };
    return;
  }
  const reg = S.screen === 'register', rec = S.screen === 'recover';
  app.innerHTML = `<div class="welcome" style="align-items:stretch;gap:4px">
    <div style="display:flex;justify-content:center;gap:10px;align-items:center;margin:10px 0 24px">${LOGO(60)}<span style="font-family:Comfortaa;font-size:38px;font-weight:700;color:#555">Scan &</span></div>
    <input id="em" type="email" placeholder="Email" autocomplete="email">
    ${rec ? '' : `<input id="pw" type="password" placeholder="Contraseña" autocomplete="${reg ? 'new-password' : 'current-password'}">`}
    ${reg ? `<input id="pw2" type="password" placeholder="Repite la contraseña" autocomplete="new-password"><label class="chk"><input type="checkbox" id="tc"> Acepto los términos y condiciones</label>` : ''}
    ${S.err ? `<div class="err">${esc(S.err)}</div>` : ''}${S.info ? `<div class="ok">${esc(S.info)}</div>` : ''}
    <button class="btn" id="go" ${S.busy ? 'disabled' : ''}>${reg ? 'Crear cuenta' : rec ? 'Enviar enlace' : 'Entrar'}</button>
    ${S.screen === 'login' ? `<button class="btn light" style="margin-top:8px;background:none" id="fp">He olvidado mi contraseña</button>` : ''}
    <button class="back" style="margin-top:auto;font-size:15px" id="bk">‹ Volver</button></div>`;
  $('#bk').onclick = () => { S.screen = rec ? 'login' : 'welcome'; S.err = S.info = ''; render(); };
  if ($('#fp')) $('#fp').onclick = () => { S.screen = 'recover'; S.err = S.info = ''; render(); };
  $('#go').onclick = async () => {
    const em = $('#em').value.trim(), pw = $('#pw')?.value || '';
    S.err = S.info = '';
    if (!em) { S.err = 'Escribe tu email.'; return render(); }
    if (reg) {
      if (pw.length < 8) { S.err = 'La contraseña debe tener al menos 8 caracteres.'; return render(); }
      if (pw !== $('#pw2').value) { S.err = 'Las contraseñas no coinciden.'; return render(); }
      if (!$('#tc').checked) { S.err = 'Tienes que aceptar los términos.'; return render(); }
    }
    S.busy = true; render();
    let r;
    if (reg) r = await sb.auth.signUp({ email: em, password: pw, options: { emailRedirectTo: SITE + '/app/' } });
    else if (rec) r = await sb.auth.resetPasswordForEmail(em, { redirectTo: SITE + '/app/' });
    else r = await sb.auth.signInWithPassword({ email: em, password: pw });
    S.busy = false;
    if (r.error) S.err = traduce(r.error.message);
    else if (reg && !r.data.session) S.info = 'Te hemos enviado un email. Pulsa el enlace para activar tu cuenta y vuelve aquí para entrar.';
    else if (rec) S.info = 'Si el email existe, te llegará un enlace para cambiar la contraseña.';
    render();
  };
}
function renderNewPass() {
  app.innerHTML = `<div class="welcome" style="align-items:stretch;gap:4px"><div style="text-align:center;margin:10px 0 20px">${LOGO(60)}</div>
    <h3 style="margin:0 0 10px">Nueva contraseña</h3><input id="np" type="password" placeholder="Nueva contraseña (mín. 8)" autocomplete="new-password">
    ${S.err ? `<div class="err">${esc(S.err)}</div>` : ''}<button class="btn" id="go">Guardar</button></div>`;
  $('#go').onclick = async () => { const p = $('#np').value; if (p.length < 8) { S.err = 'Mínimo 8 caracteres.'; return render(); }
    const { error } = await sb.auth.updateUser({ password: p }); if (error) { S.err = traduce(error.message); return render(); }
    S.recovery = false; S.err = ''; toast('Contraseña cambiada'); start((await sb.auth.getSession()).data.session); };
}
function traduce(m) {
  if (/Invalid login/i.test(m)) return 'Email o contraseña incorrectos.';
  if (/not confirmed/i.test(m)) return 'Aún no has confirmado tu email. Revisa tu correo.';
  if (/already registered/i.test(m)) return 'Ese email ya tiene cuenta. Prueba a entrar.';
  if (/rate limit/i.test(m)) return 'Demasiados intentos. Espera unos minutos.';
  return m;
}

function renderHome() {
  const nEv = newEvents(), nUn = unreadTotal();
  const tabs = [['codes', 'CÓDIGOS', 0], ['chats', 'CHATS', nUn], ['alerts', 'AVISOS', nEv]];
  let body = '';
  if (S.tab === 'codes') {
    body = S.codes.length ? S.codes.map(c => `<div class="item ${c.is_on ? '' : 'off'}" data-code="${c.id}">
        <div class="pw ${c.is_on ? 'on' : ''}" data-pw="${c.id}" title="Encender / apagar">⏻</div>
        <div class="grow"><div class="t">${esc(c.name || c.public_name || 'Sin nombre')}</div><div class="s">${esc(c.private_info || c.public_name || TYPES[c.type][1])}${c.owner_id !== S.user.id ? ' · compartido contigo' : ''}</div></div>
        ${c.owner_id === S.user.id ? `<button class="ib" data-edit="${c.id}" title="Ajustes">🎚️</button>` : ''}<button class="ib" data-qr="${c.id}" title="Ver código">⤢</button></div>`).join('')
      : `<div class="empty">Aún no tienes códigos.<br>Pulsa <b>+</b> para crear uno o para vincular un pack de pegatinas.</div>`;
    body += `<div class="empty" style="padding:18px">Para comprar etiquetas y códigos impresos pulsa <b>aquí</b></div>`;
  } else if (S.tab === 'chats') {
    const list = S.chats.slice().sort((a, b) => new Date(lastMsg(b.id)?.created_at || b.created_at) - new Date(lastMsg(a.id)?.created_at || a.created_at));
    const favs = list.filter(c => S.favs.has(c.id)), rest = list.filter(c => !S.favs.has(c.id));
    const row = c => { const lm = lastMsg(c.id), code = codeOf(c.code_id), u = S.unread[c.id]; return `<div class="item ${chatOff(c) ? 'off' : ''}" data-chat="${c.id}"><div class="av">${S.favs.has(c.id) ? '⭐' : '🙂'}</div>
      <div class="grow"><div class="t" style="color:#16707f">${esc(c.name)}${u ? `<span class="badge">${u}</span>` : ''}</div><div class="s">${esc(code?.name || '')} · ${esc(lm ? (lm.from_visitor ? '' : 'Tú: ') + lm.body : 'sin mensajes')}</div></div>
      <div style="font-size:11px;color:var(--mut)">${ago(lm?.created_at || c.created_at)}</div></div>`; };
    body = list.length ? (favs.length ? `<div class="pad section" style="padding-bottom:0">FAVORITOS</div>${favs.map(row).join('')}` : '') + (rest.length ? `${favs.length ? '<div class="pad section" style="padding-bottom:0">TODOS</div>' : ''}${rest.map(row).join('')}` : '')
      : `<div class="empty">Aún no hay chats.<br>Cuando alguien escanee uno de tus códigos y te escriba, aparecerá aquí, sin ver tu teléfono ni tu email.</div>`;
  } else {
    const seen = S.seenEv;
    body = S.events.length ? S.events.map(e => { const c = codeOf(e.code_id); const ic = { alert: '🔔', mail: '✉️', call: '📞' }[e.kind];
      return `<div class="ev ${e.id > seen ? 'new' : ''}"><div class="av">${ic}</div><div class="grow"><div class="t" style="font-weight:600">${e.kind === 'alert' ? (e.auto ? 'Alerta al escanear' : 'Alerta') : e.kind === 'mail' ? 'Mensaje' : 'Piden que llames'} · ${esc(c?.name || e.code_id)}</div>

function drawQR(canvas, text, scale = 8) {
  const q = qrcode(0, 'M'); q.addData(text); q.make(); const n = q.getModuleCount(), m = 2, sz = (n + m * 2) * scale;
  canvas.width = canvas.height = sz; const x = canvas.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, sz, sz); x.fillStyle = '#000';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) x.fillRect((c + m) * scale, (r + m) * scale, scale, scale);
}

let stream = null;
function stopCam() { stream?.getTracks().forEach(t => t.stop()); stream = null; }
function renderPack() {
  app.innerHTML = `<div class="bar"><button class="back" id="bk">‹</button><span class="name" style="font-size:16px;font-family:Inter">Añadir código</span></div><div class="body pad">

    <div style="font-size:13px;color:#777;margin:6px 2px 18px">Lo imprimes tú o lo compartes como enlace.</div>
    <div class="section">VINCULAR UN PACK DE PEGATINAS</div>
    <div style="font-size:14px;color:#555;margin-bottom:10px">Escanea el <b>QR maestro</b> de tu pack: todas sus pegatinas quedarán vinculadas a tu cuenta.</div>
    <div class="camwrap" id="cw" style="display:none"><video id="vd" playsinline muted></video></div>
    <button class="btn teal" id="sc">📷 Escanear QR maestro</button>
    <div style="display:flex;gap:6px;margin-top:10px"><input id="pk" placeholder="o escribe el código del pack" style="margin:0;text-transform:uppercase"><button class="btn sm light" id="pkb">Vincular</button></div>
    ${S.err ? `<div class="err">${esc(S.err)}</div>` : ''}</div>`;
  $('#bk').onclick = () => { stopCam(); S.err = ''; S.view = null; render(); };
  $('#nw').onclick = () => { stopCam(); S.view = { t: 'edit' }; render(); };
  $('#pkb').onclick = () => claim($('#pk').value.trim());
  $('#sc').onclick = startScan;
  if (S.view.scan) { S.view.scan = false; startScan(); }
}
async function startScan() {
  try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }); } catch (e) { return toast('No se ha podido abrir la cámara.'); }
  $('#cw').style.display = 'block'; $('#sc').style.display = 'none'; const v = $('#vd'); v.srcObject = stream; await v.play();
  const cv = document.createElement('canvas'), x = cv.getContext('2d', { willReadFrequently: true });
  const tick = () => { if (!stream) return; if (v.readyState >= 2) { cv.width = v.videoWidth; cv.height = v.videoHeight; x.drawImage(v, 0, 0); const r = jsQR(x.getImageData(0, 0, cv.width, cv.height).data, cv.width, cv.height); if (r) { stopCam(); return handleScan(r.data); } } requestAnimationFrame(tick); };
  tick();
}
function handleScan(t) {
  const pack = t.match(/\/(?:link|p)\/([A-Z0-9]+)/i), code = t.match(/\/s\/([A-Z0-9]+)/i);
  if (pack) return claim(pack[1]);
  if (code) { const c = codeOf(code[1].toUpperCase()); if (c) { S.view = { t: 'qr', id: c.id }; return render(); } window.open(t, '_blank'); S.view = null; return render(); }
  toast('Ese QR no es de Scan &: ' + t.slice(0, 60)); renderPack();
}
async function claim(id) {
  if (!id) return; S.err = '';
  const { data, error } = await sb.rpc('claim_pack', { p_pack: id.toUpperCase() });
  if (error || !data?.ok) { S.err = { not_found: 'Ese pack no existe.', already_claimed: 'Ese pack ya está vinculado a otra cuenta.' }[data?.error] || 'No se ha podido vincular.'; return render(); }
  await loadAll(); toast(`✅ Pack vinculado: ${data.codes} código${data.codes === 1 ? '' : 's'}`);
  const fresh = S.codes.filter(c => c.pack_id === id.toUpperCase());
  S.view = fresh.length === 1 ? { t: 'edit', id: fresh[0].id } : null; S.tab = 'codes'; render();
}
