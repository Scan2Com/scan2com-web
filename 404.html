  try { const b = await mBlob(u), x = document.createElement('a'); x.href = URL.createObjectURL(b); x.download = name; document.body.appendChild(x); x.click(); x.remove(); setTimeout(() => URL.revokeObjectURL(x.href), 4000); }
  catch (err) { alert('Este archivo ya no está disponible.'); }
});

load();
</script>
