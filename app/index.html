<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#1e1e1e">
<title>Scan & Pro — Mis códigos</title>
<link rel="manifest" href="/app/manifest.json">
<link rel="icon" href="/app/logo.png">
<link rel="apple-touch-icon" href="/app/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Comfortaa:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>

<style>
:root{--teal:#1aa3d9;--ink:#1d1f22;--mut:#7a7f87;--line:#e6e8eb;--bg:#eef0f2;--red:#e8352b;--green:#2fc23a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fff}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);max-width:560px;margin:0 auto;display:flex;flex-direction:column;min-height:100%}
#app{display:flex;flex-direction:column;flex:1;min-height:100vh}
#app.full{height:var(--vvh,100dvh);min-height:0;overflow:hidden;flex:none}
#app.full .scrollme{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
#app.full .bar,#app.full .compose,#app.full .notice{flex:none}
.bar{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:#1e1e1e;color:#fff;position:sticky;top:0;z-index:3}
.bar .back{color:#33b5e5}
.bar .star{color:#fff}
.bar .name{font-family:Inter;font-weight:500;font-size:21px;flex:1;color:#fff}
.ib{background:none;border:0;font-size:20px;cursor:pointer;padding:6px;color:#555}
.tabs{display:flex;background:#3a3a3a;position:sticky;top:57px;z-index:2}
.tabs button{flex:1;padding:13px 0;border:0;background:none;font:inherit;font-size:14px;font-weight:500;color:#9a9a9a;border-bottom:4px solid transparent;letter-spacing:.06em;cursor:pointer}
.tabs button.on{color:#fff;border-color:#33b5e5}
.badge{background:var(--red);color:#fff;border-radius:9px;font-size:10px;padding:1px 6px;margin-left:4px}
.body{flex:1;overflow:auto;padding-bottom:90px;background:#f7f7f7}
.foot2{background:#e2e2e2;text-align:center;padding:14px;font-size:16px;color:#444}
.searchin{flex:1;background:#2e2e2e;border:0;border-bottom:2px solid #33b5e5;border-radius:0;color:#fff;margin:0;padding:6px 4px}
.pad{padding:16px}
.item{display:flex;align-items:center;gap:14px;padding:14px 14px;border-bottom:1px solid #dcdcdc;cursor:pointer;background:linear-gradient(#f1f1f1,#f7f7f7)}
.item .t{font-weight:400;color:#1d1d1d;font-size:19px}.item .s{font-size:15px;color:#8a8a8a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.off .t,.item.off .s{color:#b5b9bf}
.grow{flex:1;min-width:0}
.pw{width:46px;height:46px;border-radius:50%;border:4px solid #3a3a3a;display:grid;place-items:center;cursor:pointer;background:radial-gradient(circle at 40% 35%,#ffffff,#d6d8db);color:#555;flex:none;box-shadow:inset 0 -2px 3px rgba(0,0,0,.15)}
.pw.on{background:radial-gradient(circle at 40% 35%,#6dff4a,#1ed40a);border-color:#3a3a3a;color:#0b3d0b}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:18px;flex:none;background:#d9dde2}
.star{font-size:22px;color:#c5c9ce;background:none;border:0;cursor:pointer;padding:4px}
.star.on{color:#f5b301}
.btn{border:0;border-radius:12px;padding:13px 14px;font:inherit;font-weight:600;cursor:pointer;background:#2a2d31;color:#fff;width:100%;font-size:15px}
.btn.light{background:#e4e6e9;color:var(--ink)}
.btn.teal{background:var(--teal)}
.btn.red{background:var(--red)}
.btn.sm{width:auto;padding:9px 12px;font-size:13px}
.btn:disabled{opacity:.5}
input,textarea,select{width:100%;font:inherit;font-size:16px;padding:11px;border:1px solid var(--line);border-radius:10px;margin:4px 0 12px;background:#fff}
label{font-size:13px;color:var(--mut)}
.chk{display:flex;gap:10px;align-items:center;font-size:15px;margin:8px 0}
.chk input{width:20px;height:20px;margin:0}
.sub{margin-left:30px;font-size:14px}
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(22px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:#2a2d31;color:#fff;border:0;font-size:28px;cursor:pointer;box-shadow:0 6px 14px rgba(0,0,0,.25);z-index:4}
.toast{position:fixed;left:50%;transform:translate(-50%,-150%);top:10px;width:min(92%,520px);background:#111;color:#fff;border-radius:14px;padding:12px 14px;font-size:14px;transition:.3s;z-index:20;cursor:pointer}
.toast.show{transform:translate(-50%,0)}
.alarm{position:fixed;inset:0;background:#fff;color:#222;z-index:15;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;gap:10px;animation:bgflash 1.2s infinite}
.sheet{position:fixed;inset:0;z-index:15;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;background:rgba(0,0,0,.55)}
@keyframes bgflash{0%,100%{background:#fff}50%{background:#fff1f0}}
.siren{position:relative;width:min(62vw,260px);aspect-ratio:500/525;margin-bottom:6px}
.siren img{position:absolute;inset:0;width:100%;height:100%}
.siren .on{animation:blink 1.2s infinite}
.siren::before{content:'';position:absolute;inset:-25%;border-radius:50%;background:radial-gradient(circle,rgba(255,40,30,.55),rgba(255,40,30,0) 65%);animation:blink 1.2s infinite}
@keyframes blink{0%,45%{opacity:1}55%,100%{opacity:0}}
.alarm h2{color:#c4160b;font-size:30px;margin:0}
.alarm .msg{background:#fff6f5;border:1px solid #f3c2bd;padding:12px 16px;border-radius:12px;font-size:17px;color:#333}
.welcome{display:flex;flex-direction:column;align-items:center;padding:40px 22px calc(30px + env(safe-area-inset-bottom));gap:18px;flex:1;background:var(--bg)}
.feat{display:flex;justify-content:space-around;width:100%;color:#8d9298;font-size:13px;text-align:center}
.feat div{font-size:26px}
.row2{display:flex;gap:10px;width:100%}
.empty{text-align:center;color:var(--mut);padding:40px 16px;font-size:14px;line-height:1.5}
.err{color:#b3261e;font-size:14px;margin:6px 0}
.ok{color:#1a7a1a;font-size:14px;margin:6px 0}
.qrbox{display:flex;flex-direction:column;align-items:center;padding:20px 16px 10px;gap:8px}
.qrbox canvas{width:220px;height:220px;image-rendering:pixelated;border-radius:14px;border:10px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.link{font-size:13px;color:var(--mut);word-break:break-all;text-align:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.msgs{display:flex;flex-direction:column;gap:6px;padding:14px}
.m{max-width:78%;padding:9px 12px 6px;border-radius:2px;font-size:17px;line-height:1.35;word-wrap:break-word;position:relative;border-bottom:2px solid #c9d6bd;box-shadow:0 1px 1px rgba(0,0,0,.06)}
.m .tm{display:flex;justify-content:flex-end;align-items:center;gap:6px;font-size:12px;color:#666;margin-top:4px}
.m.them::before,.m.me::after{content:'';position:absolute;top:10px;border:7px solid transparent}
.m.them::before{left:-13px;border-right-color:#f6fbe2}
.m.me::after{right:-13px;border-left-color:#ebf8df}
.m.me{align-self:flex-end;background:#ebf8df;color:#222;margin-right:8px}
.m.them{align-self:flex-start;background:#f6fbe2;color:#222;margin-left:8px}
.m .who{font-size:11px;opacity:.8;margin-bottom:2px}
.notice{background:#fff4d6;font-size:13px;padding:9px 14px}
.compose{display:flex;gap:6px;align-items:center;padding:10px 10px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #ddd;background:#fff;position:sticky;bottom:0}
.compose input{margin:0;border:0;border-bottom:2px solid #33b5e5;border-radius:0;padding:10px 4px}
.compose input:focus{outline:none}
.sendb{background:none;border:0;color:#8a8a8a;cursor:pointer;padding:4px}
.back{background:none;border:0;font:inherit;color:var(--teal);cursor:pointer;padding:4px 6px;font-weight:600;font-size:22px}
.ev{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;gap:12px}
.ev.new{background:#fff6f5}
.camwrap{position:relative;background:#000;border-radius:14px;overflow:hidden}
.camwrap video{width:100%;display:block}
.section{font-size:12px;font-weight:700;color:var(--mut);letter-spacing:.06em;margin:18px 0 4px}
.req::after{content:' *';color:#e8352b;font-weight:700}
.bad{border-color:#e8352b!important;background:#fff6f5}
.hint{font-size:12px;color:var(--mut);margin:-4px 0 10px}
.ic{display:block}
.ib{color:#555}
.bar .ib{color:#e0e0e0}
.qrbar-ib{color:#33b5e5!important}
.ib.dark{color:#e0e0e0}
.feat .fi{color:#8d9298;display:flex;justify-content:center;margin-bottom:4px}
.pill .ic{display:inline-block;vertical-align:-3px}
.btn .ic{display:inline-block;vertical-align:-4px;margin-right:6px}
.sw{flex:1;border:2px solid transparent;border-radius:12px;padding:10px 4px;cursor:pointer;color:#fff;font:inherit;font-size:12px;font-weight:600;text-shadow:0 1px 1px rgba(0,0,0,.3)}
.sw i{font-style:italic;color:#111;text-shadow:none}
.sw.on{border-color:#111;box-shadow:0 0 0 2px #fff inset}
.tour{margin:12px;background:#fff;border-radius:16px;box-shadow:0 4px 18px rgba(0,0,0,.12);padding:16px;display:flex;gap:14px;align-items:center}
.tour .play{flex:none;width:64px;height:64px;border-radius:50%;border:0;background:#33b5e5;color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 10px rgba(51,181,229,.4)}
.tour .cap{font-size:15px;color:#333;line-height:1.4;min-height:42px}
.tour .x{background:none;border:0;color:#999;font-size:13px;cursor:pointer;padding:4px 0 0}
.hl{position:relative;z-index:1;box-shadow:0 0 0 3px #33b5e5,0 0 18px 4px rgba(51,181,229,.55)!important;border-radius:12px;transition:box-shadow .3s}
.pill{font-size:12px;background:#eef0f2;border-radius:8px;padding:3px 8px;display:inline-flex;gap:6px;align-items:center;margin:2px 4px 2px 0}
.nbar{display:flex;gap:12px;align-items:center;margin:10px 12px 0;padding:12px 14px;background:#fff4f3;border:1px solid #f3c2bd;border-left:5px solid #e8352b;border-radius:12px;color:#5a1a14;font-size:14px;line-height:1.35;cursor:pointer}
.nbar svg{color:#e8352b;flex:none}
.nbtn{background:#e8352b;color:#fff;border-radius:16px;padding:7px 12px;font-weight:600;font-size:13px;flex:none}
.slideL{animation:slL .22s ease-out}.slideR{animation:slR .22s ease-out}
@keyframes slL{from{transform:translateX(40px);opacity:.3}to{transform:none;opacity:1}}
@keyframes slR{from{transform:translateX(-40px);opacity:.3}to{transform:none;opacity:1}}
.body{touch-action:pan-y}
</style>
</head>

// app Android: avisos por Firebase (la sirena nativa sale a pantalla completa)
async function enableNativePush(ask) {
  const P = window.Capacitor.Plugins.PushNotifications; if (!P) return false;
  let st = await P.checkPermissions(); if (st.receive !== 'granted' && ask) st = await P.requestPermissions();
  if (st.receive !== 'granted') { if (ask) toast('Permite las notificaciones de Scan & Pro en los ajustes del móvil.'); return false; }
  return new Promise(res => {
    P.removeAllListeners().then(() => {
      P.addListener('registration', async t => {
        const { error } = await sb.from('push_tokens').upsert({ token: 'fcm:' + t.value, user_id: S.user.id, platform: 'android', sub: { fcm: t.value }, updated_at: new Date().toISOString() });
        if (!error) { ls.set('sa_fcm_' + S.user.id, 1); if (ask) toast('Alertas activadas: la sirena sonará a pantalla completa aunque la app esté cerrada.'); render(true); }
        res(!error);
      });
      P.addListener('registrationError', () => { if (ask) toast('No se han podido activar los avisos.'); res(false); });
      P.register();
    });
  });
}
const b64u = s => { const b = atob((s + '='.repeat((4 - s.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(b, c => c.charCodeAt(0)); };
async function enablePush(ask = true) {
  if (NATIVE) return enableNativePush(ask);
  if (!pushOK()) { if (ask) toast(isIOS && !standalone ? 'En iPhone, primero instala la app: Compartir → “Añadir a pantalla de inicio”, y ábrela desde el icono.' : 'Este navegador no permite notificaciones.'); return false; }
  const p = ask ? await Notification.requestPermission() : Notification.permission;
  if (p !== 'granted') { if (ask) toast(p === 'denied' ? 'Las notificaciones están bloqueadas. Permítelas en los ajustes del navegador para scan.originalbim.com.' : 'No se han activado las notificaciones.'); return false; }
  try {
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) { const { key } = await fetch(PUSH_FN).then(r => r.json()); sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u(key) }); }
    const j = sub.toJSON();
    const { error } = await sb.from('push_tokens').upsert({ token: j.endpoint, user_id: S.user.id, platform: isIOS ? 'ios' : 'web', sub: j, updated_at: new Date().toISOString() });
    if (error) throw error;
    ls.set('sa_push_' + S.user.id, 1);
    if (ask) toast('Notificaciones activadas: las alertas te llegarán aunque la app esté cerrada.');
    render(true); return true;
  } catch (e) { console.error(e); if (ask) toast('No se han podido activar las notificaciones. Inténtalo de nuevo.'); return false; }
}

function openUrl(u) {

/* ---------------- datos ---------------- */
async function loadAll() {
  const [c, ch, f, ev] = await Promise.all([
    sb.from('codes').select('*').order('created_at'),
    sb.from('chats').select('id,code_id,name,created_at').order('created_at', { ascending: false }),
    sb.from('chat_favorites').select('chat_id'),
    sb.from('events').select('*').order('created_at', { ascending: false }).limit(100)
  ]);
  S.codes = c.data || []; S.chats = ch.data || []; S.favs = new Set((f.data || []).map(x => x.chat_id)); S.events = ev.data || [];
  if (S.chats.length) {
    const { data } = await sb.from('messages').select('*').in('chat_id', S.chats.map(x => x.id)).order('id');
    S.msgs = {}; (data || []).forEach(m => (S.msgs[m.chat_id] ||= []).push(m));
  }
}
const codeOf = id => S.codes.find(c => c.id === id);
const lastMsg = cid => (S.msgs[cid] || []).at(-1);
const chatOff = ch => { const c = codeOf(ch.code_id); return c && !c.is_on && !S.favs.has(ch.id); };
const newEvents = () => S.events.filter(e => e.id > S.seenEv).length;
const unreadTotal = () => Object.values(S.unread).reduce((a, b) => a + b, 0);

let channel = null;
function subscribe() {
  channel?.unsubscribe();
  channel = sb.channel('owner')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, async ({ new: m }) => {
      if (!S.chats.find(c => c.id === m.chat_id)) { const { data } = await sb.from('chats').select('id,code_id,name,created_at').eq('id', m.chat_id).single(); if (data) S.chats.unshift(data); }
      const list = (S.msgs[m.chat_id] ||= []); if (!list.find(x => x.id === m.id)) list.push(m);
      if (m.from_visitor) {
        const viewing = S.view?.t === 'chat' && S.view.id === m.chat_id && !document.hidden;
        if (!viewing) { S.unread[m.chat_id] = (S.unread[m.chat_id] || 0) + 1; ls.set('sa_unread', S.unread); }
        const ch = S.chats.find(c => c.id === m.chat_id), code = codeOf(ch?.code_id);
        if (!viewing) { toast(`💬 ${ch?.name || 'Chat'} · ${code?.name || ''}: ${m.body}`, () => { S.view = { t: 'chat', id: m.chat_id }; render(); }); notify('Nuevo mensaje · ' + (code?.name || 'Scan & Pro'), m.body); beep(); }
      }
      render(true);
    })
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'events' }, ({ new: e }) => {
      S.events.unshift(e); const code = codeOf(e.code_id);
      if (e.kind === 'alert' || e.kind === 'call') { if (!(NATIVE && notifOn())) { S.alarm = e; sirenOn(); } notify('🔔 Alerta · ' + (code?.name || 'Scan & Pro'), e.body || 'Alguien ha escaneado tu código y te avisa'); }
      else { toast(`✉️ Mensaje en “${code?.name || ''}”: ${e.body || ''}`, () => { S.tab = 'alerts'; S.view = null; render(); }); notify('✉️ Mensaje · ' + (code?.name || ''), e.body || ''); }
      render(true);
    })
    .subscribe();
}

function render(soft) {
  if (soft && document.activeElement?.id === 'rn') return;  // no cortar la edición del nombre
  const keep = soft && document.activeElement?.id ? { id: document.activeElement.id, v: document.activeElement.value } : null;
  if (S.recovery) renderNewPass();
  else if (!S.user) renderAuth();
  else if (S.view?.t === 'edit') renderEdit();
  else if (S.view?.t === 'qr') renderQR();
  else if (S.view?.t === 'chat') renderChat();
  else if (S.view?.t === 'pack') renderPack();
  else renderHome();
  if (S.view?.t !== 'chat') app.classList.remove('full');
  if (S.alarm) $('#overlay').innerHTML = alarmHTML(); else if (!$('#overlay .keep')) $('#overlay').innerHTML = '';
  if (S.touring && S.tourKeyNow) highlight(S.tourKeyNow);
  if (keep) { const el = document.getElementById(keep.id); if (el) { el.value = keep.v; el.focus(); } }
}

function traduce(m) {
  if (/Invalid login/i.test(m)) return 'Email o contraseña incorrectos.';
  if (/not confirmed/i.test(m)) return 'Aún no has confirmado tu email. Revisa tu correo.';
  if (/already registered/i.test(m)) return 'Ese email ya tiene cuenta. Prueba a entrar.';
  if (/rate limit/i.test(m)) return 'Demasiados intentos. Espera unos minutos.';
  return m;
}

/* ---------- ver código (QR) ---------- */
function drawQR(canvas, text, scale = 8) {
  const q = qrcode(0, 'M'); q.addData(text); q.make(); const n = q.getModuleCount(), m = 2, sz = (n + m * 2) * scale;
  canvas.width = canvas.height = sz; const x = canvas.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, sz, sz); x.fillStyle = '#000';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) x.fillRect((c + m) * scale, (r + m) * scale, scale, scale);
}

}

  const on = !S.favs.has(id); on ? S.favs.add(id) : S.favs.delete(id); render(true);
  toast(on ? '★ Añadido a favoritos: aparece arriba y sigue activo aunque apagues el código' : 'Quitado de favoritos');
  const { error } = on ? await sb.from('chat_favorites').insert({ chat_id: id, user_id: S.user.id }) : await sb.from('chat_favorites').delete().eq('chat_id', id).eq('user_id', S.user.id);
  if (error && !/duplicate/i.test(error.message)) { on ? S.favs.delete(id) : S.favs.add(id); render(true); toast('No se ha podido guardar el favorito.'); }
}

/* ---------- añadir: nuevo código / vincular pack / escanear ---------- */
let stream = null;
function stopCam() { stream?.getTracks().forEach(t => t.stop()); stream = null; }
function renderPack() {
  app.innerHTML = `<div class="bar"><button class="back" id="bk">${IC.back(24)}</button><span class="name" style="font-size:16px;font-family:Inter">Añadir código</span></div><div class="body pad">
    <button class="btn" id="nw">${IC.plus(20)}Crear un código nuevo</button>
    <div style="font-size:13px;color:#777;margin:6px 2px 18px">Lo imprimes tú o lo compartes como enlace.</div>
    <div class="section">VINCULAR UN PACK DE PEGATINAS</div>
    <div style="font-size:14px;color:#555;margin-bottom:10px">Escanea el <b>QR maestro</b> de tu pack: todas sus pegatinas quedarán vinculadas a tu cuenta.</div>
    <div class="camwrap" id="cw" style="display:none"><video id="vd" playsinline muted></video></div>
    <button class="btn teal" id="sc">${IC.camera(20)}Escanear QR maestro</button>
    <div style="display:flex;gap:6px;margin-top:10px"><input id="pk" placeholder="o escribe el código del pack" style="margin:0;text-transform:uppercase"><button class="btn sm light" id="pkb">Vincular</button></div>
    ${S.err ? `<div class="err">${esc(S.err)}</div>` : ''}</div>`;
  $('#bk').onclick = () => { stopCam(); S.err = ''; S.view = null; render(); };
  $('#nw').onclick = () => { stopCam(); S.view = { t: 'edit' }; render(); };
  $('#pkb').onclick = () => claim($('#pk').value.trim());
  $('#sc').onclick = startScan;
  if (S.view.scan) { S.view.scan = false; startScan(); }
}
async function startScan() {
  try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }); } catch (e) { return toast('No se ha podido abrir la cámara.'); }
  $('#cw').style.display = 'block'; $('#sc').style.display = 'none'; const v = $('#vd'); v.srcObject = stream; await v.play();
  const cv = document.createElement('canvas'), x = cv.getContext('2d', { willReadFrequently: true });
  const tick = () => { if (!stream) return; if (v.readyState >= 2) { cv.width = v.videoWidth; cv.height = v.videoHeight; x.drawImage(v, 0, 0); const r = jsQR(x.getImageData(0, 0, cv.width, cv.height).data, cv.width, cv.height); if (r) { stopCam(); return handleScan(r.data); } } requestAnimationFrame(tick); };
  tick();
}
function handleScan(t) {
  const pack = t.match(/\/(?:link|p)\/([A-Z0-9]+)/i), code = t.match(/\/s\/([A-Z0-9]+)/i);
  if (pack) return claim(pack[1]);
  if (code) { const c = codeOf(code[1].toUpperCase()); if (c) { S.view = { t: 'qr', id: c.id }; return render(); } window.open(t, '_blank'); S.view = null; return render(); }
  toast('Ese QR no es de Scan & Pro: ' + t.slice(0, 60)); renderPack();
}
async function claim(id) {
  if (!id) return; S.err = '';
  const { data, error } = await sb.rpc('claim_pack', { p_pack: id.toUpperCase() });
  if (error || !data?.ok) { S.err = { not_found: 'Ese pack no existe.', already_claimed: 'Ese pack ya está vinculado a otra cuenta.' }[data?.error] || 'No se ha podido vincular.'; return render(); }
  await loadAll(); toast(`✅ Pack vinculado: ${data.codes} código${data.codes === 1 ? '' : 's'}`);
  const fresh = S.codes.filter(c => c.pack_id === id.toUpperCase());
  S.view = fresh.length === 1 ? { t: 'edit', id: fresh[0].id } : null; S.tab = 'codes'; render();
}

/* ---------- primer código + explicación hablada ---------- */
const TOUR = [
  ['', 'Bienvenido a Scan and Pro. Te explico en medio minuto cómo funciona.'],
  ['item', 'Este es tu primer código. Ya está listo para chatear.'],
  ['item', 'Cuando alguien lo escanee con la cámara de su móvil, podrá escribirte sin ver tu teléfono ni tu email.'],
  ['pw', 'Con el botón verde lo enciendes o lo apagas cuando no quieras que te molesten.'],
  ['edit', 'En los ajustes eliges qué puede hacer quien lo escanee: avisarte con una alerta, mandarte un mensaje, chatear contigo o ir a una web.'],
  ['qr', 'Con las flechas ves el código, para imprimirlo, pegarlo donde quieras o compartirlo.'],
  ['fab', 'Y con el botón más creas nuevos códigos o vinculas tus pegatinas. Eso es todo.']
];
const tourKey = () => 'sa_tour_' + S.user.id;
function pickVoice() { const vs = speechSynthesis.getVoices(); return vs.find(v => /^es[-_]ES/i.test(v.lang)) || vs.find(v => /^es/i.test(v.lang)) || null; }
function highlight(k) {
  app.querySelectorAll('.hl').forEach(e => e.classList.remove('hl'));
  const first = app.querySelector('[data-code]'); if (!k || !first) return;
  const el = k === 'item' ? first : k === 'pw' ? first.querySelector('[data-pw]') : k === 'edit' ? first.querySelector('[data-edit]') : k === 'qr' ? first.querySelector('[data-qr]') : k === 'fab' ? $('#fab') : null;
  if (el) { el.classList.add('hl'); el.scrollIntoView({ block: 'nearest' }); }
}
function playTour() {
  const tts = 'speechSynthesis' in window; if (tts) speechSynthesis.cancel(); S.touring = true; let i = 0; const voice = tts ? pickVoice() : null;
  const next = () => {
    if (!S.touring) return;
    if (i >= TOUR.length) { S.touring = false; highlight(null); ls.set(tourKey(), 1); S.tourDone = true; render(); return; }
    const [k, t] = TOUR[i++]; S.tourKeyNow = k; S.tourCap = t; const cap = $('#tcap'); if (cap) cap.textContent = t; highlight(k);
    if (!tts) return setTimeout(next, 3500);
    const u = new SpeechSynthesisUtterance(t); u.lang = 'es-ES'; if (voice) u.voice = voice; u.rate = 1.02;
    u.onend = () => setTimeout(next, 250); u.onerror = () => setTimeout(next, 1500); speechSynthesis.speak(u);
  };
  const pb = $('#tplay'); if (pb) pb.innerHTML = IC.stop(30);
  next();
}
function stopTour() { S.touring = false; try { speechSynthesis.cancel(); } catch (e) {} highlight(null); const pb = $('#tplay'); if (pb) pb.innerHTML = IC.play(30); }
function tourHTML() {
  if (S.tab !== 'codes' || S.view || (ls.get(tourKey(), 0) && !S.tourForce)) return '';
  return `<div class="tour"><button class="play" id="tplay" title="Escuchar">${S.touring ? IC.stop(30) : IC.play(30)}</button>
    <div style="flex:1"><div class="cap" id="tcap">${S.touring ? esc(S.tourCap || '') : 'Pulsa ▶ para escuchar cómo funciona (30 s). Sube el volumen.'}</div><button class="x" id="tclose">${S.touring ? '' : 'Ahora no'}</button></div></div>`;
}
function bindTour() {
  if ($('#tplay')) $('#tplay').onclick = () => S.touring ? stopTour() : playTour();
  if ($('#tclose')) $('#tclose').onclick = () => { stopTour(); ls.set(tourKey(), 1); S.tourForce = false; render(); };
}
async function ensureStarter() {
  if (S.codes.length || ls.get('sa_starter_' + S.user.id, 0)) return;
  const { data, error } = await sb.from('codes').insert({ owner_id: S.user.id, type: 'chat', name: 'Mi código de chat', public_name: 'Escríbeme',
    public_desc: 'Hola, puedes escribirme por aquí sin necesidad de mi teléfono.', ch_info: true, ch_mail: false, ch_alert: false, ch_chat: true, ch_call: false }).select().single();
  if (!error && data) { S.codes.push(data); ls.set('sa_starter_' + S.user.id, 1); }
}

/* ---------- alarma ---------- */
function alarmHTML() {
  const e = S.alarm, c = codeOf(e.code_id);
  return `<div class="alarm"><div class="siren"><img src="/app/alert_white.png" alt=""><img class="on" src="/app/alert_red.png" alt="Alerta"></div>
    <h2>${e.kind === 'call' ? 'Te piden que llames' : '¡Alerta!'}</h2><div style="font-size:20px;font-weight:600">${esc(c?.name || '')}</div>
    ${e.body ? `<div class="msg">“${esc(e.body)}”</div>` : '<div style="color:#555">Alguien ha escaneado tu código y te avisa.</div>'}
    <button class="btn red" style="margin-top:22px;max-width:320px" id="aok">Recibido</button></div>`;
}
/* sirena: sonido continuo a volumen máximo hasta pulsar Recibido */
let siren = null;
function sirenOn() {
  if (siren) return;
  try {
    const a = new (window.AudioContext || window.webkitAudioContext)(), g = a.createGain(); g.gain.value = 1; g.connect(a.destination);
    const o = a.createOscillator(); o.type = 'square'; o.connect(g); o.start();
    const sweep = () => { const t = a.currentTime; o.frequency.cancelScheduledValues(t); o.frequency.setValueAtTime(650, t); o.frequency.linearRampToValueAtTime(1500, t + 0.45); o.frequency.linearRampToValueAtTime(650, t + 0.9); };
    sweep(); const iv = setInterval(sweep, 900);
    const vb = setInterval(() => { try { navigator.vibrate && navigator.vibrate([700, 300]); } catch (e) {} }, 1000);
    siren = { a, iv, vb };
    if (a.state === 'suspended') a.resume().catch(() => {});
  } catch (e) { beep(); }
}
function sirenOff() { if (!siren) return; clearInterval(siren.iv); clearInterval(siren.vb); try { siren.a.close(); } catch (e) {} try { navigator.vibrate && navigator.vibrate(0); } catch (e) {} siren = null; }
// si el navegador bloqueó el sonido, el primer toque en la pantalla de alarma lo arranca
document.addEventListener('pointerdown', () => { if (siren && siren.a.state === 'suspended') siren.a.resume().catch(() => {}); }, true);
document.addEventListener('click', e => { if (e.target.id === 'aok') { sirenOff(); const id = S.alarm?.id; S.alarm = null; S.tab = 'alerts'; S.view = null; render(); if (id) markRead([id]); } });
async function markRead(ids) { ids = ids.filter(Boolean); if (!ids.length) return; const now = new Date().toISOString(); S.events.forEach(e => { if (ids.includes(e.id)) e.read_at = e.read_at || now; }); await sb.rpc('mark_events_read', { p_ids: ids }); }

/* ---------- arranque ---------- */
async function start(session) {
  S.user = session?.user || null;
  if (!S.user) { channel?.unsubscribe(); return render(); }
  app.innerHTML = `<div class="empty" style="margin:auto">${LOGO(60)}<br>Cargando…</div>`;
  await loadAll(); await ensureStarter(); subscribe(); render();
  if (location.search) { openUrl(location.href); history.replaceState(null, '', '/app/'); }
  if (NATIVE) enableNativePush(false); else if (pushOK() && Notification.permission === 'granted') enablePush(false);
}
sb.auth.onAuthStateChange((ev, session) => { if (ev === 'SIGNED_IN' && !S.user) start(session); if (ev === 'SIGNED_OUT') { S.user = null; render(); } if (ev === 'PASSWORD_RECOVERY') { S.recovery = true; render(); } });
const { data: { session } } = await sb.auth.getSession(); start(session);
document.addEventListener('visibilitychange', async () => { if (!document.hidden && S.user) { await loadAll(); render(true); } });
try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => {}; } catch (e) {}
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/app/sw.js').catch(() => {}); navigator.serviceWorker.addEventListener('message', ev => { if (ev.data?.type === 'open' && S.user) openUrl(ev.data.url); }); }
</script>
