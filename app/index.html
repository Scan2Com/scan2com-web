<style>
:root{--teal:#1aa3d9;--ink:#1d1f22;--mut:#7a7f87;--line:#e6e8eb;--bg:#eef0f2;--red:#e8352b;--green:#2fc23a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fff}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);max-width:560px;margin:0 auto;display:flex;flex-direction:column;min-height:100%}
#app{display:flex;flex-direction:column;flex:1;min-height:100vh}
#app.full{height:var(--vvh,100dvh);min-height:0;overflow:hidden;flex:none}
#app.full .scrollme{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
#app.full .bar,#app.full .compose,#app.full .notice{flex:none}
.bar{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:#1e1e1e;color:#fff;position:sticky;top:0;z-index:3}
.bar .back{color:#33b5e5}
.bar .star{color:#fff}
.bar .name{font-family:Inter;font-weight:500;font-size:21px;flex:1;color:#fff}
.ib{background:none;border:0;font-size:20px;cursor:pointer;padding:6px;color:#555}
.tabs{display:flex;background:#3a3a3a;position:sticky;top:57px;z-index:2}
.tabs button{flex:1;padding:13px 0;border:0;background:none;font:inherit;font-size:14px;font-weight:500;color:#9a9a9a;border-bottom:4px solid transparent;letter-spacing:.06em;cursor:pointer}
.tabs button.on{color:#fff}
.namebar{flex:none;background:#3a3a3a;color:#fff;text-align:center;font-size:14px;font-weight:500;letter-spacing:.06em;padding:13px 12px 17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs .ind{position:absolute;left:0;bottom:0;width:33.3333%;height:4px;background:#33b5e5;transition:transform .28s cubic-bezier(.2,.8,.2,1);pointer-events:none}
#app.homepg{height:var(--vvh,100dvh);min-height:0;overflow:hidden;flex:none}
#app.homepg .bar,#app.homepg .tabs{flex:none}
.pager{flex:1;min-height:0;overflow:hidden;position:relative;background:#f7f7f7}
.track{display:flex;height:100%;will-change:transform;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.track.drag{transition:none}
.track>.page{flex:0 0 100%;width:100%;min-width:100%;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.badge{background:var(--red);color:#fff;border-radius:9px;font-size:10px;padding:1px 6px;margin-left:4px}
.body{flex:1;overflow:auto;padding-bottom:90px;background:#f7f7f7}
.foot2{background:#e2e2e2;text-align:center;padding:14px;font-size:16px;color:#444}
.searchin{flex:1;background:#2e2e2e;border:0;border-bottom:2px solid #33b5e5;border-radius:0;color:#fff;margin:0;padding:6px 4px}
.pad{padding:16px}
.item{display:flex;align-items:center;gap:14px;padding:14px 14px;border-bottom:1px solid #dcdcdc;cursor:pointer;background:linear-gradient(#f1f1f1,#f7f7f7)}
.item .t{font-weight:400;color:#1d1d1d;font-size:19px}.item .s{font-size:15px;color:#8a8a8a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.off .t,.item.off .s{color:#b5b9bf}
.grow{flex:1;min-width:0}
.pw{width:46px;height:46px;border-radius:50%;border:4px solid #3a3a3a;display:grid;place-items:center;cursor:pointer;background:radial-gradient(circle at 40% 35%,#ffffff,#d6d8db);color:#555;flex:none;box-shadow:inset 0 -2px 3px rgba(0,0,0,.15)}
.pw.on{background:radial-gradient(circle at 40% 35%,#6dff4a,#1ed40a);border-color:#3a3a3a;color:#0b3d0b}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:18px;flex:none;background:#d9dde2}
.star{font-size:22px;color:#c5c9ce;background:none;border:0;cursor:pointer;padding:4px}
.star.on{color:#f5b301}
.btn{border:0;border-radius:12px;padding:13px 14px;font:inherit;font-weight:600;cursor:pointer;background:#2a2d31;color:#fff;width:100%;font-size:15px}
.btn.light{background:#e4e6e9;color:var(--ink)}
.btn.teal{background:var(--teal)}
.btn.red{background:var(--red)}
.btn.sm{width:auto;padding:9px 12px;font-size:13px}
.btn:disabled{opacity:.5}
input,textarea,select{width:100%;font:inherit;font-size:16px;padding:11px;border:1px solid var(--line);border-radius:10px;margin:4px 0 12px;background:#fff}
label{font-size:13px;color:var(--mut)}
.chk{display:flex;gap:10px;align-items:center;font-size:15px;margin:8px 0}
.chk input{width:20px;height:20px;margin:0}
.sub{margin-left:30px;font-size:14px}
.buybar{position:fixed;left:0;right:0;bottom:0;z-index:3;max-width:560px;margin:0 auto;background:#f7f7f7;border-top:1px solid #dcdcdc;color:#8a8a8a;font-size:15px;text-align:center;padding:14px 12px calc(14px + env(safe-area-inset-bottom));cursor:pointer}
.buybar b{color:#555}
#app.homepg .fab{bottom:calc(72px + env(safe-area-inset-bottom))}
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(22px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:#2a2d31;color:#fff;border:0;font-size:28px;cursor:pointer;box-shadow:0 6px 14px rgba(0,0,0,.25);z-index:4}
.toast{position:fixed;left:50%;transform:translate(-50%,-150%);top:10px;width:min(92%,520px);background:#111;color:#fff;border-radius:14px;padding:12px 14px;font-size:14px;transition:.3s;z-index:20;cursor:pointer}
.toast.show{transform:translate(-50%,0)}
.alarm{position:fixed;inset:0;background:#fff;color:#222;z-index:15;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;gap:10px;animation:bgflash 1.2s infinite}
.sheet{position:fixed;inset:0;z-index:15;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;background:rgba(0,0,0,.55)}
@keyframes bgflash{0%,100%{background:#fff}50%{background:#fff1f0}}
.siren{position:relative;width:min(62vw,260px);aspect-ratio:500/525;margin-bottom:6px}
.siren img{position:absolute;inset:0;width:100%;height:100%}
.siren .on{animation:blink 1.2s infinite}
.siren::before{content:'';position:absolute;inset:-25%;border-radius:50%;background:radial-gradient(circle,rgba(255,40,30,.55),rgba(255,40,30,0) 65%);animation:blink 1.2s infinite}
@keyframes blink{0%,45%{opacity:1}55%,100%{opacity:0}}
@keyframes blinkInv{0%,45%{opacity:0}55%,100%{opacity:1}}
.siren.pol{width:min(82vw,340px)}
.siren.pol .sh{animation:blinkInv 1.2s infinite;object-fit:contain;padding:4% 8%;box-sizing:border-box}
.alarm h2{color:#c4160b;font-size:30px;margin:0}
.alarm .msg{background:#fff6f5;border:1px solid #f3c2bd;padding:12px 16px;border-radius:12px;font-size:17px;color:#333}
.welcome{display:flex;flex-direction:column;align-items:center;padding:40px 22px calc(30px + env(safe-area-inset-bottom));gap:18px;flex:1;background:var(--bg)}
.feat{display:flex;justify-content:space-around;width:100%;color:#8d9298;font-size:13px;text-align:center}
.feat div{font-size:26px}
.row2{display:flex;gap:10px;width:100%}
.empty{text-align:center;color:var(--mut);padding:40px 16px;font-size:14px;line-height:1.5}
.err{color:#b3261e;font-size:14px;margin:6px 0}
.ok{color:#1a7a1a;font-size:14px;margin:6px 0}
.qrbox{display:flex;flex-direction:column;align-items:center;padding:20px 16px 10px;gap:8px}
.qrbox canvas{width:220px;height:220px;image-rendering:pixelated;border-radius:14px;border:10px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.dsg{display:flex;gap:10px;margin:8px 0 4px}.dsg button{flex:1;background:#fff;border:2px solid #e3e3e3;border-radius:12px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font:500 12px Inter,sans-serif;color:#555;cursor:pointer}.dsg button.on{border-color:#2fc23a;color:#1a7a1a;background:#f3fbf3}.dsg canvas{width:64px;height:64px;object-fit:contain}
.qrbox canvas.rnd{image-rendering:auto}
.qrbox canvas.stk{width:230px;height:auto;image-rendering:auto;border:0;border-radius:0;box-shadow:none;filter:drop-shadow(0 3px 8px rgba(0,0,0,.25))}
.link{font-size:13px;color:var(--mut);word-break:break-all;text-align:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.msgs{display:flex;flex-direction:column;gap:6px;padding:14px}
.m{max-width:78%;padding:9px 12px 6px;border-radius:2px;font-size:17px;line-height:1.35;word-wrap:break-word;position:relative;border-bottom:2px solid #c9d6bd;box-shadow:0 1px 1px rgba(0,0,0,.06)}
.m .tm{display:flex;justify-content:flex-end;align-items:center;gap:6px;font-size:12px;color:#666;margin-top:4px}
.m.them::before,.m.me::after{content:'';position:absolute;top:10px;border:7px solid transparent}
.m.them::before{left:-13px;border-right-color:#f6fbe2}
.m.me::after{right:-13px;border-left-color:#ebf8df}
.m.me{align-self:flex-end;background:#ebf8df;color:#222;margin-right:8px}
.m.them{align-self:flex-start;background:#f6fbe2;color:#222;margin-left:8px}
.bm{display:inline-block;width:16px;height:16px;color:#2fc23a;transition:transform 1.1s cubic-bezier(.5,.05,.3,1),color .3s .85s}
.bm.left{transform:translateX(var(--fly,0));color:#9aa0a6;transition:transform 1.1s cubic-bezier(.5,.05,.3,1),color .2s}

.bmsend{width:30px!important;height:30px!important;background:#1aa3d9!important;transform:rotate(225deg)}
.bm.left i{transform:rotate(45deg)}
/* ya leído y quieto: el tic verde de siempre */
.bm b{display:none}
.bm.home:not(.fly) i{display:none}
.bm.home:not(.fly) b{display:block;line-height:0}
.bm.now,.bm.now i{transition:none!important}
.bm.fly i{animation:bmspin .32s linear infinite}
@keyframes bmspin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.m .who{font-size:11px;opacity:.8;margin-bottom:2px}
.notice{background:#fff4d6;font-size:13px;padding:9px 14px}
.phw{position:relative;display:block}.pview{position:fixed;inset:0;z-index:60;background:#000;color:#fff;overflow:hidden}.pvs{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;touch-action:none;overflow:hidden}.pvs img{max-width:100%;max-height:100%;object-fit:contain;display:block;transform-origin:center center;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.pvbar{position:absolute;left:0;right:0;display:flex;align-items:center;transition:opacity .2s}.pview.bare .pvbar{opacity:0;pointer-events:none}.pvt{top:0;padding:calc(8px + env(safe-area-inset-top)) 10px 18px;background:linear-gradient(rgba(0,0,0,.7),transparent);gap:8px}.pvbtn{border:0;background:none;color:#fff;width:44px;height:44px;display:grid;place-items:center;cursor:pointer}.pvinfo{display:flex;flex-direction:column;font-size:13px;line-height:1.35}.pvinfo b{font-size:16px;font-weight:600}.pvinfo span{color:#ccc;text-transform:capitalize}.pvf{bottom:0;justify-content:space-around;padding:18px 10px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.7))}.pvact{border:0;background:none;color:#fff;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;cursor:pointer;padding:6px 18px}.pvm{position:absolute;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(255,255,255,.92);color:#111;padding:9px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}.pvm.show{opacity:1}.phsrc{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:2px 7px;border-radius:10px}.phsrc.cam{background:rgba(26,163,217,.9)}
.mph{display:block;max-width:220px;max-height:260px;border-radius:12px;margin:2px 0}.camb{border:0;background:none;padding:4px;cursor:pointer;flex:none;display:flex}.camb i{display:block;width:32px;height:32px;background:#1aa3d9;-webkit-mask:url(/app/img2014/camera.png) center/contain no-repeat;mask:url(/app/img2014/camera.png) center/contain no-repeat}
.compose{display:flex;gap:6px;align-items:center;padding:10px 10px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #ddd;background:#fff;position:sticky;bottom:0}
.compose input{margin:0;border:0;border-bottom:2px solid #33b5e5;border-radius:0;padding:10px 4px}
.compose input:focus{outline:none}
.sendb{background:none;border:0;color:#8a8a8a;cursor:pointer;padding:4px;touch-action:none;user-select:none;-webkit-user-select:none}.sendb .bmsend{display:none}.sendb.txt .bmsend{display:block}.sendb.txt .micb{display:none}.micb{display:block;color:#1aa3d9;line-height:0}.compose.rec .micb{color:#e8352b;transform:scale(1.35)}.compose.rec input,.compose.rec .camb{visibility:hidden}.recst{position:absolute;left:16px;right:70px;top:50%;transform:translateY(-50%);font-size:17px;color:#333;pointer-events:none}.recst b{color:#e8352b}.recst span{color:#999;font-size:13px;margin-left:8px}.aud{display:flex;flex-direction:column;gap:2px}.aud audio{width:230px;max-width:100%;height:40px}.aud span{font-size:12px;color:#777}
.back{background:none;border:0;font:inherit;color:var(--teal);cursor:pointer;padding:4px 6px;font-weight:600;font-size:22px}
.ev{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;gap:12px}
.ev.new{background:#fff6f5}
/* misma altura de fila en Códigos, Chats y Avisos (la de la lista de códigos) */
.page .item,.page .ev{height:83px;box-sizing:border-box;overflow:hidden}
.page .ev{align-items:center;padding:0 14px;gap:14px;border-bottom:1px solid #dcdcdc;background:linear-gradient(#f1f1f1,#f7f7f7);cursor:pointer}
.page .ev.new{background:#fff6f5}
.page .ev .av{width:54px;height:54px}
.ev .t1{font-weight:400;font-size:19px;color:#1d1d1d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const sb = createClient('https://kbkyosyenotqjcgujbmn.supabase.co', 'sb_publishable_Ac2fFMZTIWXMGfEURbVc8Q_Z2gcpujt');
// ---- fotos en los chats: el mensaje lleva "img:" + la dirección de la foto (comprimida en el móvil, sin datos de ubicación)
const PHOTO_URL = 'https://kbkyosyenotqjcgujbmn.supabase.co/storage/v1/object/public/chat-photos/';
const isPhoto = b => typeof b === 'string' && b.startsWith('img:' + PHOTO_URL);
const AUDIO_URL = 'https://kbkyosyenotqjcgujbmn.supabase.co/storage/v1/object/public/chat-audio/';
const isAudio = b => typeof b === 'string' && b.startsWith('aud:' + AUDIO_URL);
const prevBody = b => isPhoto(b) ? '📷 Foto' : isAudio(b) ? '🎤 Audio' : (b || '');

const photoTag = b => /#cam$/.test(b) ? '<span class="phsrc cam">📷 Hecha ahora</span>' : /#gal$/.test(b) ? '<span class="phsrc">🖼️ De la galería</span>' : '';
const audBody = b => { const u = b.slice(4).replace(/#.*$/, ''), s = +(b.match(/#(\d+)$/) || [])[1] || 0; return `<div class="aud"><audio controls preload="none" src="${esc(u)}"></audio><span>🎤 ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}</span></div>`; };

const pvTime = d => d ? new Date(d).toLocaleString('es-ES', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
const pvName = (url, at) => { const d = at ? new Date(at) : new Date(), p = n => String(n).padStart(2, '0'); return `scan2com-foto-${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.${(url.split('#')[0].match(/\.(\w{3,4})(\?|$)/) || [, 'jpg'])[1]}`; };
const pvMsg = t => { const m = document.getElementById('pvm'); if (!m) return; m.textContent = t; m.classList.add('show'); clearTimeout(m._t); m._t = setTimeout(() => m.classList.remove('show'), 2600); };
async function pvData(url) { const b = await (await fetch(url.split('#')[0])).blob(); return { blob: b, b64: await new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result.split(',')[1]); f.readAsDataURL(b); }) }; }
async function pvDownload(url, at) {
  const name = pvName(url, at), P = window.Capacitor?.Plugins;
  try {
    const { blob, b64 } = await pvData(url);
    if (window.Capacitor?.isNativePlatform?.() && P?.Filesystem) {
      try { await P.Filesystem.writeFile({ path: 'Scan2Com/' + name, data: b64, directory: 'DOCUMENTS', recursive: true }); return pvMsg('Foto guardada en Documentos/Scan2Com'); }
      catch (e) { const f = await P.Filesystem.writeFile({ path: name, data: b64, directory: 'CACHE' }); return await P.Share.share({ title: name, files: [f.uri], dialogTitle: 'Guardar foto' }); }
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);

async function pvShare(url, at) {
  const name = pvName(url, at), P = window.Capacitor?.Plugins;
  try {
    const { blob, b64 } = await pvData(url);
    if (window.Capacitor?.isNativePlatform?.() && P?.Share && P?.Filesystem) {
      const f = await P.Filesystem.writeFile({ path: name, data: b64, directory: 'CACHE' });
      return await P.Share.share({ title: 'Foto', files: [f.uri], dialogTitle: 'Compartir foto' });
    }
    const file = new File([blob], name, { type: blob.type || 'image/jpeg' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) return await navigator.share({ files: [file], title: 'Foto' });
    if (navigator.share) return await navigator.share({ url: url.split('#')[0], title: 'Foto' });

}
function pvHtml(url, at, tag) {
  const src = /#cam$/.test(url) ? '📷 Hecha ahora' : /#gal$/.test(url) ? '🖼️ De la galería' : 'Foto';
  return `<div class="pview" id="pv"><div class="pvs" id="pvs"><img id="pvi" src="${esc(url.split('#')[0])}" alt="Foto" draggable="false"></div>
  <div class="pvt pvbar"><button class="pvbtn" id="pvx" aria-label="Volver"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><div class="pvinfo"><b>${src}</b>${at ? `<span>${esc(pvTime(at))}</span>` : ''}</div></div>
  <div class="pvf pvbar"><button class="pvact" id="pvd"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Descargar</button><button class="pvact" id="pvsh"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="2.6"/><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="19" r="2.6"/><path d="M8.3 10.8l7.4-4.3M8.3 13.2l7.4 4.3"/></svg>Compartir</button></div>
  <div class="pvm" id="pvm"></div></div>`;
}
function pvBind(url, at, close) {
  const v = document.getElementById('pv'), box = document.getElementById('pvs'), img = document.getElementById('pvi');
  document.getElementById('pvx').onclick = close;
  document.getElementById('pvd').onclick = () => pvDownload(url, at);
  document.getElementById('pvsh').onclick = () => pvShare(url, at);
  let s = 1, tx = 0, ty = 0, st = null, down = 0, moved = false, lastTap = 0, tapT = null;
  const pts = new Map();
  const apply = anim => { img.style.transition = anim ? 'transform .2s' : 'none'; img.style.transform = `translate(${tx}px,${ty}px) scale(${s})`; };
  const clamp = () => { if (s <= 1.01) { s = 1; tx = 0; ty = 0; return; } const r = box.getBoundingClientRect(), mx = Math.max(0, (img.offsetWidth * s - r.width) / 2), my = Math.max(0, (img.offsetHeight * s - r.height) / 2); tx = Math.min(mx, Math.max(-mx, tx)); ty = Math.min(my, Math.max(-my, ty)); };
  const rel = () => { const r = box.getBoundingClientRect(), p = [...pts.values()], cx = p.reduce((a, q) => a + q.x, 0) / p.length - r.left - r.width / 2, cy = p.reduce((a, q) => a + q.y, 0) / p.length - r.top - r.height / 2; return { cx, cy, d: p.length > 1 ? Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y) : 0, n: p.length, s, tx, ty }; };

function pickPhoto() {
  return new Promise(res => {
    const pick = cam => { $('#overlay').innerHTML = ''; const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*'; if (cam) i.setAttribute('capture', 'environment'); i.onchange = () => { const f = i.files[0]; res(f ? { f, cam: cam && Date.now() - f.lastModified < 120e3 } : null); }; i.click(); };
    $('#overlay').innerHTML = `<div class="sheet keep" id="phs"><div style="background:#fff;color:#222;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))" onclick="event.stopPropagation()">
      <button class="btn" id="phc" style="margin-bottom:8px">📷 Hacer foto ahora</button><button class="btn light" id="phg">🖼️ Elegir de la galería</button></div></div>`;
    $('#phs').onclick = () => { $('#overlay').innerHTML = ''; res(null); }; $('#phc').onclick = () => pick(true); $('#phg').onclick = () => pick(false);

async function compressPhoto(f, max = 1280, q = 0.72) {   // redimensiona y vuelve a codificar en JPEG: ocupa poco y pierde los datos EXIF (GPS)
  const img = await new Promise((ok, ko) => { const u = URL.createObjectURL(f), im = new Image(); im.onload = () => { URL.revokeObjectURL(u); ok(im); }; im.onerror = ko; im.src = u; });

// audio: con el campo vacío, el botón de enviar es un micrófono; mantener pulsado graba, soltar envía, deslizar a la izquierda cancela (máx. 2 min)
const audMime = () => ['audio/webm;codecs=opus', 'audio/mp4', 'audio/ogg;codecs=opus'].find(t => window.MediaRecorder?.isTypeSupported?.(t)) || '';
function bindMic(chatId, sendBody) {
  const btn = $('#os'), inp = $('#oi'), cmp = btn?.closest('.compose'); if (!btn || !inp || !cmp) return;

const BM_SVG = '';
const bm = (id, read, at) => `<span class="bm" data-bm="${id}" data-read="${read ? 1 : 0}" data-at="${esc(at || '')}" title="${read ? 'Leído' : 'Enviado, sin leer'}"><i></i><b>${IC.check(16)}</b></span>`;

function bmPlace(el, p) { el.classList.remove('home', 'left', 'fly'); el.classList.add('now', p); void el.offsetWidth; el.classList.remove('now'); }
function bmFly(el, from, to) { bmPlace(el, from); el.classList.add('fly'); el.classList.remove(from); el.classList.add(to); setTimeout(() => el.classList.remove('fly'), 1150); }
function bmSync() {
  const all = [...document.querySelectorAll('.bm')], lastEl = all.at(-1);
  all.forEach(el => {
    const box = el.closest('.msgs'); if (!box) return;
    const id = el.dataset.bm, want = el.dataset.read === '1' ? 'home' : 'left', cur = S.bmPos[id];
    el.style.setProperty('--fly', -Math.max(0, el.parentElement.getBoundingClientRect().right - 18 - box.getBoundingClientRect().left - 6) + 'px');   // se mide desde el sitio fijo (la hora), no desde el boomerang ya movido
    if (el !== lastEl) { S.bmPos[id] = want; return bmPlace(el, want); }   // solo se mueve el del último mensaje
    if (!cur && !(Date.now() - (S.bmJustSent || 0) < 15000)) { S.bmPos[id] = want; return bmPlace(el, want); }
    const wait = (S.bmBusy[id] || 0) - Date.now();
    if (wait > 0) { bmPlace(el, cur); return setTimeout(bmSync, wait + 40); }   // a medio vuelo: termina el viaje y luego sigue
    if (!cur) {   // recién enviado: siempre sale volando a la izquierda; si ya está leído, vuelve después
      S.bmJustSent = 0; S.bmPos[id] = 'left'; S.bmBusy[id] = Date.now() + 1300; bmFly(el, 'home', 'left');
      if (want === 'home') setTimeout(bmSync, 1350);
      return;
    }
    if (cur === want) return bmPlace(el, want);
    S.bmPos[id] = want; S.bmBusy[id] = Date.now() + 1300; bmFly(el, cur, want);
  });
}

function traduce(m) {
  if (/Invalid login/i.test(m)) return 'Email o contraseña incorrectos.';
  if (/not confirmed/i.test(m)) return 'Aún no has confirmado tu email. Revisa tu correo.';
  if (/already registered/i.test(m)) return 'Ese email ya tiene cuenta. Prueba a entrar.';
  if (/rate limit/i.test(m)) return 'Demasiados intentos. Espera unos minutos.';
  return m;
}

/* ---------- ver código (QR) ---------- */
function drawQR(canvas, text, scale = 8) {
  const q = qrcode(0, 'M'); q.addData(text); q.make(); const n = q.getModuleCount(), m = 2, sz = (n + m * 2) * scale;
  canvas.width = canvas.height = sz; const x = canvas.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, sz, sz); x.fillStyle = '#000';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) x.fillRect((c + m) * scale, (r + m) * scale, scale, scale);
}
/* QR redondeado (estilo del generador de 2014) y pegatina alta del coche */
const loadImg = src => new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = src; });
async function prettyQR(text, side) {
  const q = qrcode(0, 'M'); q.addData(text); q.make(); const n = q.getModuleCount(), p = Math.max(4, Math.floor(side / n));
  const cv = document.createElement('canvas'); cv.width = cv.height = n * p; const x = cv.getContext('2d');
  const on = (c, r) => c >= 0 && r >= 0 && c < n && r < n && q.isDark(r, c);
  const quad = (c, r, dx, dy) => x.fillRect(c * p + (dx > 0 ? p / 2 : 0), r * p + (dy > 0 ? p / 2 : 0), p / 2 + .5, p / 2 + .5);
  const dot = (c, r) => { x.beginPath(); x.arc(c * p + p / 2, r * p + p / 2, p / 2, 0, 7); x.fill(); };
  const D = [[-1, -1], [1, -1], [1, 1], [-1, 1]]; x.fillStyle = '#000';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
    if (on(c, r)) { D.forEach(([dx, dy]) => { if (on(c + dx, r) || on(c, r + dy) || on(c + dx, r + dy)) quad(c, r, dx, dy); }); dot(c, r); }
    else {
      D.forEach(([dx, dy]) => { if (on(c + dx, r) && on(c, r + dy)) quad(c, r, dx, dy); });
      x.globalCompositeOperation = 'destination-out'; dot(c, r); x.globalCompositeOperation = 'source-over';
    }
  }
  // ojos redondeados como los del generador de 2014
  const rr = (X, Y, w, rad) => { x.beginPath(); x.moveTo(X + rad, Y); x.arcTo(X + w, Y, X + w, Y + w, rad); x.arcTo(X + w, Y + w, X, Y + w, rad); x.arcTo(X, Y + w, X, Y, rad); x.arcTo(X, Y, X + w, Y, rad); x.closePath(); x.fill(); };
  [[0, 0], [n - 7, 0], [0, n - 7]].forEach(([c, r]) => { const X = c * p, Y = r * p; x.clearRect(X, Y, 7 * p, 7 * p);
    rr(X, Y, 7 * p, 1.4 * p); x.globalCompositeOperation = 'destination-out'; rr(X + p, Y + p, 5 * p, 0.9 * p); x.globalCompositeOperation = 'source-over'; rr(X + 2 * p, Y + 2 * p, 3 * p, 0.8 * p); });
  return cv;
}
async function drawSticker(canvas, url, hex) {
  const base = await loadImg('/app/img2014/pegatina_coche.png');
  canvas.width = base.width; canvas.height = base.height; const x = canvas.getContext('2d', { willReadFrequently: true }); x.drawImage(base, 0, 0); tintRed(x, canvas.width, canvas.height, hex);
  // recuadro blanco de la pegatina: x 107-1018, y 113-1024 (en una base de 1124 x 1532)
  const k = base.width / 1124, side = 784 * k, qr = await prettyQR(url, Math.round(side * 2)); x.imageSmoothingQuality = 'high';
  x.drawImage(qr, 562.5 * k - side / 2, 568.5 * k - side / 2, side, side);
}
const DESIGNS = [['square', 'Clásico'], ['round', 'Redondeado'], ['car', 'Scan 2 Alert']];
// colores de la pegatina de coche (el rojo es el original de la plantilla)
const CAR_COLORS = [['rojo', '#fe0000', 'Rojo'], ['naranja', '#ff3300', 'Naranja'], ['amarillo', '#f6df00', 'Amarillo'], ['verde', '#2e9e3a', 'Verde'], ['rosa', '#f0599b', 'Rosa'], ['azul', '#004c98', 'Azul'], ['celeste', '#009cd7', 'Azul claro'], ['gris', '#b4b9bc', 'Gris claro'], ['grafito', '#4a4f53', 'Gris oscuro']];
const carColor = c => CAR_COLORS.find(k => k[0] === c?.style?.car_color) || CAR_COLORS[0];
// cambia el rojo de la plantilla por otro color, manteniendo el degradado y los bordes suaves
function tintRed(ctx, w, h, hex) {
  if (!hex || hex === '#fe0000') return;
  const T = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16)), d = ctx.getImageData(0, 0, w, h), p = d.data;
  for (let i = 0; i < p.length; i += 4) {
    const r = p[i], m = Math.max(p[i + 1], p[i + 2]), red = r - m;
    if (red > 25) { const f = red / 254; p[i] = T[0] * f + m; p[i + 1] = T[1] * f + m; p[i + 2] = T[2] * f + m; }
  }
  ctx.putImageData(d, 0, 0);
}
const designOf = c => c?.style?.design || (c?.style?.car ? 'car' : 'square');
const isCar = c => designOf(c) === 'car';
// QR redondeado con margen blanco
async function drawRound(canvas, url, side = 480) {
  const q = await prettyQR(url, side), m = Math.round(q.width * 0.08);
  canvas.width = canvas.height = q.width + 2 * m; const x = canvas.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, canvas.width, canvas.height); x.drawImage(q, m, m);
}
// pinta el código con el diseño elegido
async function drawDesign(canvas, c, url, big) {
  const d = designOf(c); canvas.classList.toggle('stk', d === 'car'); canvas.classList.toggle('rnd', d === 'round');
  try {
    if (d === 'car') return await drawSticker(canvas, url, carColor(c)[1]);
    if (d === 'round') return await drawRound(canvas, url, big ? 1600 : 480);
  } catch (e) { canvas.classList.remove('stk', 'rnd'); }
  drawQR(canvas, url, big ? 24 : 8);
}
// compartir el código con la imagen adjunta (WhatsApp, Telegram, email…)
async function codeImage(c, url) {
  const big = document.createElement('canvas'); await drawDesign(big, c, url, true); return big.toDataURL('image/png');
}
async function shareCode(c, url) {
  const title = (c.owner_id === S.user?.id ? 'Mi código' : 'Código') + ' Scan2Com: ' + (c.public_name || c.name || c.id), text = `${c.public_name || c.name}\n${url}`, name = `scan2com-${c.id}.png`;
  try {
    const data = await codeImage(c, url), P = window.Capacitor?.Plugins;
    if (NATIVE && P?.Share && P?.Filesystem) {
      const f = await P.Filesystem.writeFile({ path: name, data: data.split(',')[1], directory: 'CACHE' });
      return await P.Share.share({ title, text, files: [f.uri], dialogTitle: 'Compartir código' });
    }
    const blob = await (await fetch(data)).blob(), file = new File([blob], name, { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) return await navigator.share({ title, text, files: [file] });
    if (navigator.share) return await navigator.share({ title, text, url });
    await navigator.clipboard.writeText(url); toast('Enlace copiado. Usa el botón de guardar para descargar la imagen.');
  } catch (e) { if (!/abort|cancel/i.test(String(e?.message || e))) toast('No se ha podido compartir.'); }
}

function pdfFromJpeg(jpgDataUrl, pw, ph, wmm, hmm, pagew = 210, pageh = 297, note = '') {

    `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 4 0 R >> /Font << /F1 6 0 R >> >> /Contents 5 0 R >>`,
    `<< /Type /XObject /Subtype /Image /Width ${pw} /Height ${ph} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${img.length} >>\nstream\n${img}\nendstream`];
  const fs = 8.5, line = (t, dy) => `\nBT /F1 ${fs} Tf 0.25 g ${Math.max(20, (pt(pagew) - t.length * fs * 0.47) / 2).toFixed(2)} ${(Y - dy).toFixed(2)} Td (${t.replace(/[^\x20-\xff]/g, '').replace(/([\\()])/g, '\\$1')}) Tj ET`;
  const cs = `q ${W} 0 0 ${H} ${X} ${Y} cm /Im0 Do Q` + [].concat(note || []).map((t, i) => line(t, 22 + i * 13)).join('');
  objs.push(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`, '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');

  out += `trailer\n<< /Size ${objs.length + 1} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF\n`;

}

  if (r && k !== 1) { const sc = p => p && ({ x: p.x / k, y: p.y / k }); for (const key in r.location) r.location[key] = sc(r.location[key]); }

async function startScan() {
  try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 }, advanced: [{ focusMode: 'continuous' }] } }); }
  catch (e) { try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }); } catch (e2) { return toast('No se ha podido abrir la cámara.'); } }
  $('#cw').style.display = 'block'; if ($('#sc')) $('#sc').style.display = 'none'; const v = $('#vd'); v.srcObject = stream; await v.play();
  const cv = document.createElement('canvas'), x = cv.getContext('2d', { willReadFrequently: true });
  // lectores, del más robusto al más sencillo: lector nativo del sistema (BarcodeDetector), ZXing (WebAssembly) y jsQR
  const det = await qrReaders(); let n = 0;
  const tick = async () => {
    if (!stream) return;
    if (v.readyState >= 2 && v.videoWidth) {
      let r = null; n++;
      try { r = await qrDecode(det, v, cv, x, n); } catch (e) {}
      if (!stream) return;
      if (r) return found(r);
    }
    setTimeout(tick, det.bd ? 80 : 160);
  };
  // código detectado: congelar la imagen, mostrar los puntos láser sobre los cuadrados del QR y esperar 1 s
  const found = r => {
    v.pause(); $('#cw').classList.add('found');
    const c = $('#pts'), k = Math.max(c.clientWidth / v.videoWidth, c.clientHeight / v.videoHeight); c.width = c.clientWidth * 2; c.height = c.clientHeight * 2; const g = c.getContext('2d'); g.scale(2, 2); g.translate((c.clientWidth - v.videoWidth * k) / 2, (c.clientHeight - v.videoHeight * k) / 2);
    const L = r.location, P = [L.topLeftFinderPattern, L.topRightFinderPattern, L.bottomLeftFinderPattern, L.bottomRightAlignmentPattern].filter(Boolean);
    const t0 = performance.now(); let done = false;
    // pase lo que pase con el dibujo, a los 0,8 s se abre el código
    const go = () => {
      if (done) return; done = true; stopCam(); $('#cw')?.classList.remove('found'); busy(true);
      // si algo falla al abrir el código, no se queda la cámara congelada: aviso y vuelta a la lista
      const fail = e => { console.error(e); busy(false); toast('No se ha podido abrir el código' + (e?.message ? ': ' + e.message : '.')); if (S.view?.t === 'pack') { S.view = null; render(); } };
      const wd = setTimeout(() => fail(new Error('tiempo agotado')), 15000);
      Promise.resolve().then(() => handleScan(r.data)).then(() => { clearTimeout(wd); busy(false); }, e => { clearTimeout(wd); fail(e); });
    };
    setTimeout(go, 800);
    const draw = now => { try { draw2(now); } catch (e) { go(); } };
    const draw2 = now => {
      // el reloj del primer fotograma puede ir por detrás de t0: un radio negativo daba error y congelaba la pantalla
      const f = Math.max(0, Math.min(1, (now - t0) / 350)); g.clearRect(-c.width, -c.height, c.width * 3, c.height * 3);
      g.strokeStyle = 'rgba(255,40,40,.55)'; g.lineWidth = 2; g.beginPath();
      [L.topLeftCorner, L.topRightCorner, L.bottomRightCorner, L.bottomLeftCorner].forEach((q, i) => i ? g.lineTo(q.x * k, q.y * k) : g.moveTo(q.x * k, q.y * k)); g.closePath(); g.stroke();
      P.forEach((q, i) => { const rad = (i === 3 ? 5 : 8) * f; g.fillStyle = 'rgba(255,214,0,.35)'; g.beginPath(); g.arc(q.x * k, q.y * k, rad * 2.2, 0, 7); g.fill(); g.fillStyle = '#ffd600'; g.shadowColor = '#ffea00'; g.shadowBlur = 12; g.beginPath(); g.arc(q.x * k, q.y * k, rad, 0, 7); g.fill(); g.shadowBlur = 0; });
      if (done) return; if (now - t0 < 600) requestAnimationFrame(draw); else go();
    };
    try { navigator.vibrate && navigator.vibrate(60); } catch (e) {}
    requestAnimationFrame(draw);
  };
  tick();
}
function handleScan(t) {
  const pack = t.match(/\/(?:link|p)\/([A-Z0-9]+)/i), code = t.match(/\/s\/([A-Z0-9]+)/i);
  if (pack) return claim(pack[1]);
  if (code && S.auth) { S.view = null; render(); return policeSheet(code[1].toUpperCase()); }
  if (code) { const c = codeOf(code[1].toUpperCase()); if (c) { S.view = { t: c.owner_id === S.user.id ? 'edit' : 'qr', id: c.id }; return render(); } stopCam(); app.classList.remove('full'); if (/^https:\/\/(www\.)?scan2com\.com\//i.test(t)) return openScanned(code[1].toUpperCase()); window.open(t, '_blank'); S.view = null; return render(); }
  toast('Ese QR no es de Scan2Com: ' + t.slice(0, 60)); if (S.view?.only) S.view.scan = true; renderPack();
}
async function claim(id) {
  if (!id) return; S.err = '';
  const { data, error } = await sb.rpc('claim_pack', { p_pack: id.toUpperCase() });
  if (error || !data?.ok) { S.err = { not_found: 'Ese pack no existe.', already_claimed: 'Ese pack ya está vinculado a otra cuenta.' }[data?.error] || 'No se ha podido vincular.'; return render(); }
  await loadAll(); toast(`✅ Pack vinculado: ${data.codes} código${data.codes === 1 ? '' : 's'}`);
  const fresh = S.codes.filter(c => c.pack_id === id.toUpperCase());
  S.view = fresh.length === 1 ? { t: 'edit', id: fresh[0].id } : null; S.tab = 'codes'; render();
}

  const next = () => {

    if (i >= steps.length) { S.touring = false; highlight(null); if (!name) { ls.set(tourKey(), 1); S.tourDone = true; render(); } else { const pb = $('#tplay'); if (pb) pb.innerHTML = IC.play(30); const cap = $('#tcap'); if (cap) cap.textContent = 'Pulsa ▶ para volver a escucharlo.'; } return; }
    const [k, t] = steps[i++]; S.tourKeyNow = k; S.tourCap = t; const cap = $('#tcap'); if (cap) cap.textContent = t; highlight(k);
    if (NT) { NT.speak({ text: t, lang: 'es-ES', rate: 1.0, volume: 1.0 }).then(() => setTimeout(next, 250)).catch(() => setTimeout(next, 3500)); return; }

/* email con el PDF normal de las pegatinas del coche: automático una sola vez al registrarse (si falla, se reintenta al abrir la app),
   y a mano desde el botón PDF siempre que quiera */
async function mailCarSheet(c, manual, mirror) {
  const k = 'sa_carmail_' + S.user.id;
  if (!manual) {
    if (ls.get(k, 0) || Date.now() - new Date(S.user.created_at || 0) > 7 * 864e5) return;
    c = S.codes.find(c => c.owner_id === S.user.id && isCar(c)); if (!c) return;
  }
  if (S.mailing) return; S.mailing = true;   // evita envíos repetidos por varios toques seguidos
  if (manual) busy(true, 'Enviando…');
  try {
    const { bin, name } = await carSheetBin(c, `${SITE}/s/${c.id}`, !!mirror);
    const { data: { session } } = await sb.auth.getSession(); if (!session) throw new Error('sin sesión');
    const r = await fetch(PUSH_FN.replace(/push$/, 'pegatina'), { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session.access_token }, body: JSON.stringify({ code_id: c.id, filename: name, pdf: btoa(bin), manual: !!manual, mirror: !!mirror }) });
    const j = await r.json().catch(() => ({}));
    if (manual) { busy(false); toast(j.sent ? `PDF enviado a ${S.user.email}` : j.error === 'limit' ? 'Ya te lo hemos enviado varias veces hoy. Prueba mañana.' : 'No se ha podido enviar el email.'); return; }
    if (r.ok && (j.sent || j.already)) { ls.set(k, 1); if (j.sent) toast('Te hemos enviado a tu email el PDF de las pegatinas para tu coche.'); }
  } catch (e) { if (manual) { busy(false); toast('No se ha podido enviar el email.'); } }
  finally { S.mailing = false; }
}

    : `<div class="siren"><img src="/app/alert_white.png" alt=""><img class="on" src="/app/alert_red.png" alt="Alerta"></div>`;
  const head = `<h2 ${pol ? 'style="color:#0b2a6b;margin:0 0 4px"' : ''}>${pol ? 'Aviso de la Policía' : e.kind === 'call' ? 'Te piden que llames' : '¡Alerta!'}</h2>`;
  return `<div class="alarm">${pol ? head + sir : sir + head}${pol && e.authority ? `<div style="color:#0b2a6b;font-weight:600">${esc(e.authority.body)} · agente ${esc(e.authority.badge)}</div>` : ''}<div style="font-size:20px;font-weight:600">${esc(c?.name || '')}</div>
    ${e.body ? `<div class="msg">“${esc(e.body)}”</div>` : (pol ? '<div style="color:#555">Te piden que acudas a tu vehículo.</div>' : '<div style="color:#555">Alguien ha escaneado tu código y te avisa.</div>')}
    <button class="btn red" style="margin-top:22px;max-width:320px" id="aok">Recibido</button></div>`;
}
/* sirena: sonido continuo a volumen máximo hasta pulsar Recibido */
let siren = null;
function sirenOn() {
  if (siren) return;
  try {
    const a = new (window.AudioContext || window.webkitAudioContext)(), g = a.createGain(); g.gain.value = 1; g.connect(a.destination);
    const o = a.createOscillator(); o.type = 'square'; o.connect(g); o.start();
    const sweep = () => { const t = a.currentTime; o.frequency.cancelScheduledValues(t); o.frequency.setValueAtTime(650, t); o.frequency.linearRampToValueAtTime(1500, t + 0.45); o.frequency.linearRampToValueAtTime(650, t + 0.9); };
    sweep(); const iv = setInterval(sweep, 900);
    const vb = setInterval(() => { try { navigator.vibrate && navigator.vibrate([700, 300]); } catch (e) {} }, 1000);
    siren = { a, iv, vb };
    if (a.state === 'suspended') a.resume().catch(() => {});
  } catch (e) { beep(); }
}
function sirenOff() { if (!siren) return; clearInterval(siren.iv); clearInterval(siren.vb); try { siren.a.close(); } catch (e) {} try { navigator.vibrate && navigator.vibrate(0); } catch (e) {} siren = null; }
// si el navegador bloqueó el sonido, el primer toque en la pantalla de alarma lo arranca
document.addEventListener('pointerdown', () => { if (siren && siren.a.state === 'suspended') siren.a.resume().catch(() => {}); }, true);
document.addEventListener('click', e => { if (e.target.id === 'aok') { sirenOff(); const id = S.alarm?.id; S.alarm = null; S.tab = 'alerts'; S.view = null; render(); if (id) markRead([id]); } });
async function markRead(ids) { ids = ids.filter(Boolean); if (!ids.length) return; const now = new Date().toISOString(); S.events.forEach(e => { if (ids.includes(e.id)) e.read_at = e.read_at || now; }); await sb.rpc('mark_events_read', { p_ids: ids }); }

/* ---------- versión: ¿está instalada la última? ---------- */
const APK_URL = 'https://www.scan2com.com/app/scan2com.apk';
const fmtD = d => { if (!d) return ''; const x = new Date(d); return isNaN(x) ? '' : x.toLocaleString('es-ES', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); };
async function checkVersion(manual) {
  const g = async f => { try { const r = await fetch(`/app/${f}?t=${Date.now()}`, { cache: 'no-store' }); return r.ok ? await r.json() : null; } catch (e) { return null; } };
  const [web, apk] = await Promise.all([g('version-web.json'), g('version-apk.json')]);
  let build = null; try { if (NATIVE && window.Capacitor.Plugins.App) build = Number((await window.Capacitor.Plugins.App.getInfo()).build) || null; } catch (e) {}
  // la página cargada es antigua (caché del móvil): se recarga una vez con la nueva
  if (web && WEB_BUILD.id !== 'dev' && web.id !== WEB_BUILD.id) {
    const k = 'sa_reload_' + web.id;
    if (!sessionStorage.getItem(k)) { sessionStorage.setItem(k, 1); location.replace('/app/?v=' + web.id); return; }
  }
  const old = !!(NATIVE && apk && build && build < apk.build);
  const last = [web?.date, apk?.date].filter(Boolean).sort().pop() || WEB_BUILD.date;
  S.ver = { web, apk, build, old, last, ok: !!(web || apk) }; if (old) render();
  if (old) toast('Hay una versión nueva de Scan2Com. Toca aquí para actualizar.', () => { location.href = APK_URL; });
  else if (manual) toast(S.ver.ok ? 'Tienes la última versión (' + fmtD(last) + ').' : 'No se ha podido comprobar la versión. Revisa la conexión.');
}

/* ---------- arranque ---------- */
async function start(session) {
  S.user = session?.user || null;
  if (!S.user) { channel?.unsubscribe(); return render(); }
  app.innerHTML = `<div style="position:fixed;inset:0;background:#000;display:grid;place-items:center;z-index:30"><img src="/app/img2014/icon.png" width="170" height="170" alt="Scan2Com" onerror="this.src='/app/icon-192.png'"></div>`;
  await loadAll(); await ensureStarter(); await ensureCar(); subscribe(); render(); syncAuto(); checkTerms(); setTimeout(() => mailCarSheet(), 3000);
  if (location.search) { openUrl(location.href); history.replaceState(null, '', '/app/'); }
  checkVersion();
  if (NATIVE) { await Promise.race([enableNativePush(false), new Promise(r => setTimeout(r, 5000))]); avInit(); } else if (pushOK() && Notification.permission === 'granted') enablePush(false);
}
/* ---------- vídeo de bienvenida: solo la primera vez que se abre la app ---------- */
(function intro() {
  if (ls.get('sa_intro_v1', 0)) return;
  const d = document.createElement('div');
  d.id = 'intro'; d.style.cssText = 'position:fixed;inset:0;background:#000;z-index:60;display:grid;place-items:center;transition:opacity .5s';
  d.innerHTML = '<video poster="data:image/gif;base64,R0lGODlhAQABAAAAACw=" src="/app/scanand_splash_movil.mp4" autoplay muted playsinline preload="auto" style="width:100%;height:100%;object-fit:contain"></video><button style="position:absolute;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:18px;padding:8px 16px;font:inherit;font-size:14px">Saltar ›</button>';
  document.body.appendChild(d);
  const end = () => { ls.set('sa_intro_v1', 1); d.style.opacity = '0'; setTimeout(() => d.remove(), 500); };
  const v = d.querySelector('video'); v.onended = end; v.onerror = end; d.querySelector('button').onclick = end;
  setTimeout(() => { if (document.body.contains(d) && v.currentTime === 0) end(); }, 5000);  // si no se puede reproducir, no bloquear
})();
sb.auth.onAuthStateChange((ev, session) => { if (ev === 'SIGNED_IN' && !S.user) start(session); if (ev === 'SIGNED_OUT') { S.user = null; render(); } if (ev === 'PASSWORD_RECOVERY') { S.recovery = true; render(); } });
const { data: { session } } = await sb.auth.getSession(); if (!S.user || S.user.id !== session?.user?.id) start(session);  // no arrancar dos veces (SIGNED_IN + getSession) con la misma cuenta
document.addEventListener('visibilitychange', async () => { if (!document.hidden && S.user) { if (S.view?.t === 'edit') { refreshAutoPerm(); return; } await loadAll(); render(true); } });
try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => {}; } catch (e) {}
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/app/sw.js').catch(() => {}); navigator.serviceWorker.addEventListener('message', ev => { if (ev.data?.type === 'open' && S.user) openUrl(ev.data.url); }); }
</script>
