name: APK Android
on:
  workflow_dispatch:
  push:
    paths: ['android/**', '.github/workflows/apk.yml']
permissions:
  contents: write
concurrency: { group: apk, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Preparar proyecto
        working-directory: android
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          pip install pillow
          python3 setup.py
      - name: Compilar APK
        working-directory: android/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Publicar APK en la web
        run: |
          cp android/android/app/build/outputs/apk/debug/app-debug.apk app/scanandpro.apk
          git config user.name "scanand-bot"
          git config user.email "scanand-bot@users.noreply.github.com"
          git add app/scanandpro.apk app/img2014
          git commit -m "APK Android actualizado" || echo "sin cambios"
          git pull --rebase && git push
      - uses: actions/upload-artifact@v4
        with: { name: scanandpro-apk, path: app/scanandpro.apk }
